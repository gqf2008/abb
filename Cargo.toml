[package]
name = "agent-bridge"
version = "2.19.6"
edition = "2021"
build = "build.rs"

[dependencies]
# GUI：Slint 1.17 托盘应用。
# 视觉改造（像素风）：slint-pixel 组件库（@slint_pixel 导入，Pixel* 控件）。
slint-pixel = { path = "../slint-pixel/crates/slint-pixel" }
# 渲染器：用默认 femtovg（OpenGL）。历史：曾固定 renderer-skia——旧注释记录 femtovg 在
# macOS accessory 进程 + 先 hide 后 show 的窗口上渲染全黑；2026-08-15 实测（slint 1.17.1 /
# macOS 15.x）该症状不复现：femtovg 设置窗渲染正常、托盘图标正常。
# （旧注释「software 让托盘图标不显示」经查为误诊：托盘图标转换走 Image::to_rgba8
# 像素解码，与渲染器无关。）切换收益：去掉 skia-bindings 构建链——冷构建会联网尝试
# 拉取预编译二进制（失败会回退源码编译而非构建失败，但 skia C++ 源码编译冷跑达
# 30 分钟级）+ 二进制更小。software 渲染器仍在默认特性里，可用
# SLINT_BACKEND=winit-software 兜底排查（BackendSelector 原生支持，全平台一致）。
slint = { version = "1.17", features = ["unstable-winit-030"] }
tokio = { version = "1", features = [
    "rt-multi-thread", "macros", "process", "time", "sync", "io-util", "signal"] }
# #69 后台任务治理：TaskTracker（rt 特性）+ CancellationToken 优雅关闭
tokio-util = { version = "0.7", features = ["rt"] }
# WS：关默认 native-tls，rustls + webpki 根证书 = 全静态
tokio-tungstenite = { version = "0.26", default-features = false,
                      features = ["connect", "rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false,
            features = ["rustls-tls-webpki-roots", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
fastrand = "2"
anyhow = "1"
async-trait = "0.1"
# 跨进程文件锁（deliveries.lock）：CLI 入队 / service ack 并发安全，Unix flock + Windows LockFileEx
fs2 = "0.4"
qrcode = { version = "0.14", default-features = false, features = ["svg", "image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
dirs = "6"
futures-util = "0.3"
libc = "0.2"
aes = "0.8"
sha2 = "0.10"

# macOS：透明标题栏 + 隐藏标题 + 内容铺满（对齐 ../aerodesk，保留红绿灯/原生拖动）。
# 窗口属性钩子经 BackendSelector::with_winit_window_attributes_hook 注入（ui.rs
# configure_backend），无需直接依赖 i-slint-backend-winit；winit 直接依赖仅为
# 导入 WindowAttributesExtMacOS 扩展 trait。
[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"

[build-dependencies]
slint-build = "1.17"
slint-pixel = { path = "../slint-pixel/crates/slint-pixel" }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

# #153：Windows 隐藏控制台 spawn agent——std Command 不暴露 STARTUPINFO，
# 须用 CreateProcessW + CREATE_NEW_CONSOLE + SW_HIDE（见 src/winproc.rs）。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# #129 锁屏控制 root 特权助手（macOS）：独立二进制，与主程序同目录打包/独立签名。
# 非 macOS 平台为占位 main（拒绝运行），保证全平台构建一致（Windows CI 不炸）。
[[bin]]
name = "abb-helper"
path = "src/bin/abb-helper.rs"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true

# #111 本地补丁：i-slint-core 的 Windows 托盘窗口从 message-only 改为顶层隐藏窗口，
# 使 Slint 内置的 TaskbarCreated 图标重建逻辑真正生效（explorer 重启后托盘自动恢复）。
# 上游 1.17.1 用 HWND_MESSAGE 收不到 HWND_BROADCAST 广播（spike 已验证）。
# 升级 slint 时需同步核对 third_party/i-slint-core 是否仍需要该补丁。
[patch.crates-io]
i-slint-core = { path = "third_party/i-slint-core" }
