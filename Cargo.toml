[package]
name = "agent-bridge"
version = "2.23.73"
edition = "2021"
license = "MIT"
build = "build.rs"

[dependencies]
# GUI：Slint 1.18 托盘应用。
# 视觉改造（像素风）：slint-pixel 组件库（@slint_pixel 导入，Pixel* 控件）。
slint-pixel = "0.2.2"
# 渲染器：用默认 femtovg（OpenGL）。历史：曾固定 renderer-skia——旧注释记录 femtovg 在
# macOS accessory 进程 + 先 hide 后 show 的窗口上渲染全黑；2026-08-15 实测（slint 1.17.1 /
# macOS 15.x）该症状不复现：femtovg 设置窗渲染正常、托盘图标正常。
# （旧注释「software 让托盘图标不显示」经查为误诊：托盘图标转换走 Image::to_rgba8
# 像素解码，与渲染器无关。）切换收益：去掉 skia-bindings 构建链——冷构建会联网尝试
# 拉取预编译二进制（失败会回退源码编译而非构建失败，但 skia C++ 源码编译冷跑达
# 30 分钟级）+ 二进制更小。software 渲染器仍在默认特性里，可用
# SLINT_BACKEND=winit-software 兜底排查（BackendSelector 原生支持，全平台一致）。
slint = { version = "1.18", features = ["unstable-winit-030"] }
# 飞书卡片内容安全化：图片节点必须由 CommonMark parser 定位（手写词法扫描在代码围栏/
# 行内代码/引用式图片等惰性上下文上连续两轮被独立审查证伪）。该版本已在依赖树里
# （i-slint-common 依赖它），不引入新的下载或编译单元。
pulldown-cmark = { version = "0.13.4", default-features = false }
tokio = { version = "1", features = [
    "rt-multi-thread", "macros", "process", "time", "sync", "io-util", "signal"] }
# #69 后台任务治理：TaskTracker（rt 特性）+ CancellationToken 优雅关闭
tokio-util = { version = "0.7", features = ["rt", "codec"] }
# WS：关默认 native-tls，rustls + webpki 根证书 = 全静态
tokio-tungstenite = { version = "0.26", default-features = false,
                      features = ["connect", "rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false,
            features = ["rustls-tls-webpki-roots", "json", "stream", "multipart"] }
# #209 工作区版本管理：内置 libgit2（进程内 init/add/commit/diff），删除保护快照
# （trash.rs）与 bot 启动基线（service.rs）共用，不依赖系统 git、不依赖 PATH。
# 关默认特性（ssh/https/openssl）：纯本地操作，不联网、少一条 C 依赖链。
git2 = { version = "0.21", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
turso = "0.7.2"
uuid = { version = "1", features = ["v4"] }
fastrand = "2"
# 微信 iLink getuploadurl 要求 rawfilemd5（协议体必填字段）；md5 是纯 Rust 零依赖小 crate，
# 比手写摘要稳（项目对 base64 手写是因为要零依赖且极短，摘要算法不值得手写）。
md5 = "0.7"
anyhow = "1"
async-trait = "0.1"
# 跨进程文件锁（deliveries.lock）：CLI 入队 / service ack 并发安全，Unix flock + Windows LockFileEx
fs2 = "0.4"
qrcode = { version = "0.14", default-features = false, features = ["svg", "image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
dirs = "6"
futures-util = "0.3"
libc = "0.2"
# buzz harness 移植（#200）：ACP 会话/回合协议、killpg 进程组终止、tracing 日志
tracing = "0.1"
nix = { version = "0.31", features = ["signal", "process"] }
chrono = "0.4"
thiserror = "2"
aes = "0.8"
sha2 = "0.10"

# macOS：透明标题栏 + 隐藏标题 + 内容铺满（对齐 ../aerodesk，保留红绿灯/原生拖动）。
# 窗口属性钩子经 BackendSelector::with_winit_window_attributes_hook 注入（ui.rs
# configure_backend），无需直接依赖 i-slint-backend-winit；winit 直接依赖仅为
# 导入 WindowAttributesExtMacOS 扩展 trait。
[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"

[build-dependencies]
slint-build = "1.18"
slint-pixel = "0.2.2"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

# #129 锁屏控制 root 特权助手（macOS）：独立二进制，与主程序同目录打包/独立签名。
# 非 macOS 平台为占位 main（拒绝运行），保证全平台构建一致（Windows CI 不炸）。
[[bin]]
name = "abb-helper"
path = "src/bin/abb-helper.rs"

# A1 第一批：Windows 提权 helper（`runas` 短命拉起，只做三个自动登录操作）。
# 与 `abb-helper` 同风格显式声明；非 Windows 平台为占位 main（拒绝运行），
# 保证全平台构建一致。逻辑本体在 lib target（`src/lib.rs` → `src/elev/`），
# 与主程序共用同一份白名单/校验/审计。
[[bin]]
name = "abb-elev-helper"
path = "src/bin/abb-elev-helper.rs"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true

[dev-dependencies]
# buzz-acp 移植测试：暂停时钟（start_paused）与手动推进。仅测试构建编译，
# 不进发布二进制。
tokio = { version = "1", features = ["test-util"] }
# 圆角窗口区域的 oracle：Slint 默认的 femtovg 渲染器就是用它栅格化圆角路径
# （`Path::rounded_rect` + `Canvas::contains_point`）。版本与 Cargo.lock 中 slint 依赖的
# 一致（0.27.0），不引入新的下载；仅测试构建编译。
femtovg = "0.27.0"

# #111 本地补丁：i-slint-core 的 Windows 托盘窗口从 message-only 改为顶层隐藏窗口，
# 使 Slint 内置的 TaskbarCreated 图标重建逻辑真正生效（explorer 重启后托盘自动恢复）。
# 上游 1.18.0 仍未修复：其 windows.rs 与 1.17.1 对应文件逐字节相同，
# 仍导入 HWND_MESSAGE 并以 Some(HWND_MESSAGE) 创建窗口；message-only 窗口收不到
# HWND_BROADCAST 的 TaskbarCreated 广播（spike 已验证）。因此 1.18.0 继续重新应用该补丁。
[patch.crates-io]
i-slint-core = { path = "third_party/i-slint-core" }
