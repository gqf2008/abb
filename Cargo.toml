[package]
name = "agent-bridge"
version = "2.0.3"
edition = "2021"
build = "build.rs"

[dependencies]
# GUI：Slint 1.17 托盘应用。
# 渲染器：必须显式开 renderer-skia。Slint 默认 feature 只有 femtovg+software（**不含 skia**，
# 尽管旧注释误以为含）。FemtoVG(OpenGL) 在 macOS accessory 进程 + 先 hide 后 show 的窗口上
# 会渲染成全黑（surface 没正常建立）；Skia(CoreGraphics) 稳定。software 渲染器则让托盘
# image→NSImage 失败、图标不显示。故三选一用 skia。
slint = { version = "1.17", features = ["unstable-winit-030", "renderer-skia"] }
tokio = { version = "1", features = [
    "rt-multi-thread", "macros", "process", "time", "sync", "io-util", "signal"] }
# WS：关默认 native-tls，rustls + webpki 根证书 = 全静态
tokio-tungstenite = { version = "0.26", default-features = false,
                      features = ["connect", "rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false,
            features = ["rustls-tls-webpki-roots", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
fastrand = "2"
anyhow = "1"
async-trait = "0.1"
qrcode = { version = "0.14", default-features = false, features = ["svg", "image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
dirs = "6"
futures-util = "0.3"
libc = "0.2"

[build-dependencies]
slint-build = "1.17"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
