# ABB work-unit board. Move cards by appending signed `status` entries,
# never by editing this file.
version = 1

[sort]
by = "ts"
direction = "desc"

[[column]]
name = "merged"
status = "merged"

[[column]]
name = "closed"
status = "closed"

# Surface PRs whose patch fails review/merge policy.
[[column]]
name = "merge-blocked"
merge = "blocked"

[[column]]
name = "unverified"
unverified = true

[[column]]
name = "open"
status = "open"

[[column]]
name = "in-progress"
status = "in-progress"

[[column]]
name = "needs-review"
status = "needs-review"

[[column]]
name = "blocked"
status = "blocked"

[[column]]
name = "needs-human"
status = "needs-human"

# Catch-all: never hide a thread with a status this board does not know yet.
[[column]]
name = "other"
