# walgit decentralized CI task declaration. The runner executes these commands
# from the commit under test; local GitHub Actions remain the release mirror.
#
# ── 这些任务假定 **POSIX shell**（卡 `abb-ci-coverage-win-20261007`）────────────────────────
# 为什么每条 command 都套一层 `sh -c '...'`：walgit 本地 runner 在 Windows 上经 `cmd /C`
# 执行任务，而 cmd **不认** POSIX 语义——abb-win 实测 `cmd /C tools/check_test_isolation.sh`
# 会**记 exit 0 且日志为空**（"签假绿"：没有任何断言跑过却显示通过），这是最危险的失败形态。
# 套 `sh -c` 后：POSIX 主机照常工作（外层 sh 再套一层 sh）；cmd 主机上 `sh` 不存在或收到
# 带单引号的畸形 argv ⇒ **立刻非零退出**，把"假绿"变成"响亮的红"。
# 结论：本文件的任务**只能**在 POSIX 主机（macOS/Linux）上跑；Windows 的门禁覆盖走
# `.github/workflows/ci.yml` 的 windows job（clippy -D warnings + 全量 cargo test + CRT 断言）。
version = 1

claim_ttl = "75m"
timeout = "60m"
max_attempts = 1

[[task]]
name = "fmt"
refs = ["refs/heads/*", "refs/tags/v*"]
command = "sh -c 'cargo fmt --check'"
timeout = "10m"
env_allow = ["CARGO_HOME", "RUSTUP_HOME", "RUSTC_WRAPPER", "CARGO_TARGET_DIR"]

[[task]]
name = "clippy"
refs = ["refs/heads/*", "refs/tags/v*"]
command = "sh -c 'cargo clippy --all-targets -- -D warnings'"
timeout = "30m"
env_allow = [
  "CARGO_HOME",
  "RUSTUP_HOME",
  "RUSTFLAGS",
  "RUSTC_WRAPPER",
  "CARGO_TARGET_DIR",
]

[[task]]
name = "build"
refs = ["refs/heads/*", "refs/tags/v*"]
command = "sh -c 'cargo build --locked'"
timeout = "30m"
env_allow = [
  "CARGO_HOME",
  "RUSTUP_HOME",
  "RUSTFLAGS",
  "RUSTC_WRAPPER",
  "CARGO_TARGET_DIR",
]

[[task]]
name = "test"
refs = ["refs/heads/*", "refs/tags/v*"]
command = "sh -c 'tools/check_test_isolation.sh'"
timeout = "45m"
env_allow = [
  "CARGO_HOME",
  "RUSTUP_HOME",
  "RUSTFLAGS",
  "RUSTC_WRAPPER",
  "CARGO_TARGET_DIR",
]

# abb-agent 是独立包（root 无 [workspace]），root 的 fmt/clippy/build/test 编不到它。
# 没有这条任务，分支上的代码会烂掉而不被任何门禁发现。
# 这里**真的跑测试**：abb-agent 的用例全部离线（faux provider / 捕获式 Writer /
# 注入式 env），跑得起；而 --no-run 会让「回合顺序/漏文本」这类回归锁在 CI 永不执行。
[[task]]
name = "abb-agent-lint"
refs = ["refs/heads/*", "refs/tags/v*"]
command = "sh -c 'cargo fmt --manifest-path crates/abb-agent/Cargo.toml -- --check && cargo clippy --manifest-path crates/abb-agent/Cargo.toml --all-targets --locked -- -D warnings && cargo test --manifest-path crates/abb-agent/Cargo.toml --locked'"
timeout = "45m"
env_allow = [
  "CARGO_HOME",
  "RUSTUP_HOME",
  "RUSTFLAGS",
  "RUSTC_WRAPPER",
  "CARGO_TARGET_DIR",
]
