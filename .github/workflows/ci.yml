name: CI

# PR / main 推送 / 手动触发：clippy -D warnings 门禁 + 全量测试 + macOS 编译验证。
# 仓库此前只有 release.yml（打 tag 发版），没有 PR 级门禁；本工作流补这个缺口。
# test job 跑 windows-latest：与开发主环境一致；macOS 特有代码（ui.rs 里
# configure_backend 的 cfg(target_os="macos") 分支、winit 窗口属性钩子）由
# check-macos job 补编译验证（渲染器已去 skia，冷构建不再需要 ninja/clang）。
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # fmt 独立小 job：不编译，秒级反馈。
  # 注意：仓库基线在现行 stable rustfmt 下有 68 处历史格式漂移（先于本工作流存在），
  # 统一重排属单独议题；在此之前 continue-on-error 顾问运行（有注解，不卡合并）。
  fmt:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # slint-pixel 是本地 path 依赖（../slint-pixel），CI 需一并拉取（public 仓库）
      - name: Checkout slint-pixel (path dep)
        uses: actions/checkout@v4
        with:
          repository: gqf2008/slint-pixel
          path: slint-pixel

      # checkout 不允许 path 出 workspace（../slint-pixel 被拒），先落 workspace 内再移出
      - name: Move slint-pixel to ../ (cargo path dep)
        shell: bash
        run: mv slint-pixel ../slint-pixel
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt
      - run: cargo fmt --check

  # abb-agent 是独立包（自有 manifest + lock，不挂 root workspace），root 的
  # clippy/fmt 覆盖不到它。这里补 PR 级门禁。
  # 测试**真跑**（它的探针在本地是常规门禁的一部分，用例本身不 flaky）。
  abb-agent-lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/abb-agent

      - name: fmt（abb-agent）
        run: cargo fmt --check --manifest-path crates/abb-agent/Cargo.toml

      - name: clippy（abb-agent，-D warnings 门禁）
        run: cargo clippy --locked --manifest-path crates/abb-agent/Cargo.toml --all-targets -- -D warnings

      - name: test（abb-agent）
        run: cargo test --locked --manifest-path crates/abb-agent/Cargo.toml

  # abb-agent 已是 **Windows 的 owner 默认执行层**，而它此前只在 release tag 时被
  # Windows 编译到（tag 才跑 release.yml）⇒ PR 级必须补一次 Windows 覆盖。
  # cfg(windows) 分支在 macOS 上根本不编译（既有盲区）。
  # **测试在这里真跑**（原来只 `--no-run`）：本包的用例是它唯一的行为断言，
  # 「编译绿当行为绿」会把 Windows 侧（verbatim 路径 / 路径分隔符 / 子进程语义）的
  # 回归整个放过去。两条腿的假 CLI 已按平台改写（unix = sh 脚本，Windows = .cmd），
  # 所以这里不需要 `--no-run` 也能跑。
  abb-agent-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/abb-agent

      - name: build（abb-agent，Windows）
        run: cargo build --locked --manifest-path crates/abb-agent/Cargo.toml

      - name: clippy（abb-agent，Windows）
        run: cargo clippy --locked --manifest-path crates/abb-agent/Cargo.toml --all-targets -- -D warnings

      - name: test（abb-agent，Windows，真跑）
        run: cargo test --locked --manifest-path crates/abb-agent/Cargo.toml

      # 随包 CLI 工具在 **Windows** 上真的能取到并落地（owner 2026-10-11 要求这批工具支持 Windows）：
      # 取件 + 同一份 checker 断言"包产物 + 多调包暴露的名字"都在。本机（macOS）无法跑 ps1，
      # 这条 CI 步骤是 Windows 侧唯一的机器判据。
      - name: 随包 CLI 工具取件 + 校验（Windows）
        shell: pwsh
        run: |
          ./tools/fetch_bundled_tools.ps1 -Platform windows-x64 -Dest tools-dist
          bash tools/check_bundled_tools.sh --platform windows-x64 --bin-dir tools-dist/bin

  # abb-chart 也是独立包（自有 manifest + lock，root 的 fmt/clippy/test 覆盖不到它）。
  # 与 abb-agent 同构：PR 级补 macOS 门禁。
  # 为什么必须有：它的 84 个用例（含「字体缺字形必须拒绝出图」「规格内容不得穿越目录」
  # 这类真实缺陷的钉子）此前只在开发机上跑过；没有这个 job，CI 上**永远不执行**。
  abb-chart-lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/abb-chart

      - name: fmt（abb-chart）
        run: cargo fmt --check --manifest-path crates/abb-chart/Cargo.toml

      - name: clippy（abb-chart，-D warnings 门禁）
        run: cargo clippy --locked --manifest-path crates/abb-chart/Cargo.toml --all-targets -- -D warnings

      - name: test（abb-chart，真跑）
        run: cargo test --locked --manifest-path crates/abb-chart/Cargo.toml

  # abb-chart 要**随 Windows 安装包分发**（`agent-bridge chart` 按同目录解析它），
  # 而在此之前它只在 release tag 时才被 Windows 编译到 ⇒ PR 级必须补一次。
  # 另：它依赖的 charton（tiny-skia / ab_glyph / fontdb）在 Windows 上能否编译、字体探针
  # 在 Windows 上是否可用（`Microsoft YaHei` 等候选），都只能在这里得到机器判据。
  abb-chart-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/abb-chart

      - name: build（abb-chart，Windows）
        run: cargo build --locked --manifest-path crates/abb-chart/Cargo.toml

      - name: clippy（abb-chart，Windows）
        run: cargo clippy --locked --manifest-path crates/abb-chart/Cargo.toml --all-targets -- -D warnings

      - name: test（abb-chart，Windows，真跑）
        run: cargo test --locked --manifest-path crates/abb-chart/Cargo.toml

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # slint-pixel 是本地 path 依赖（../slint-pixel），CI 需一并拉取（public 仓库）
      - name: Checkout slint-pixel (path dep)
        uses: actions/checkout@v4
        with:
          repository: gqf2008/slint-pixel
          path: slint-pixel

      # checkout 不允许 path 出 workspace（../slint-pixel 被拒），先落 workspace 内再移出
      - name: Move slint-pixel to ../ (cargo path dep)
        shell: bash
        run: mv slint-pixel ../slint-pixel
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: clippy（-D warnings 门禁）
        run: cargo clippy --all-targets -- -D warnings

      - name: test（全量测试）
        # `--show-output`：让**通过**的用例也打印自己的 stdout/stderr。libtest 默认丢弃，
        # 于是「环境不满足 ⇒ 大声跳过某一条」的 `[skip]` 说明在 CI 日志里完全静音——
        # 「跳过去了」与「真验过」长得一模一样（卡 `abb-blur-race-flaky-20261029` 评审 NB-1）。
        # 本地门禁 tools/check_test_isolation.sh 已带同一旗标，这里补齐 CI 那一侧。
        run: cargo test -- --show-output

      # #331：Windows 分发靠 `.cargo/config.toml` 的 +crt-static 自带 CRT。
      # 在 PR 阶段就拦住「配置被删/被 RUSTFLAGS 覆盖」——否则用户装完才发现
      # 「找不到 VCRUNTIME140.dll」。release job 里对**发布产物**再拦一次。
      - name: Assert no dynamic CRT dependency (#331)
        shell: bash
        run: |
          cargo build
          bash tools/check_dynamic_crt.sh target/debug/agent-bridge.exe

      # #317：Windows 上有一批依赖 python3（tests/mock_acp_agent.py）的端到端用例会被
      # `cfg_attr(windows, ignore)` 跳过——把清单显式列出来，让「绿但没跑」可见。
      # 它们由下面的 test-macos job 真实执行。
      - name: 列出被 ignore 的用例（可见性）
        if: always()
        run: cargo test -- --list --ignored

      # 同一件事的反向断言：这次修 CI 时新增的两条 `ignore` **必须真的在清单里**。
      # 只「打印」不「断言」的话，某天有人把 `cfg_attr(windows, ignore)` 写成
      # `cfg_attr(unix, ignore)` 之类，签名静静消失而 CI 依旧全绿。
      #
      # 为什么不做「白名单全量比对」：Windows 上本来就有 20+ 条依赖 python3 的用例
      # 被 ignore（#317），把那份全量清单拄进 YAML 会很快腐化（每加一条测试就要改
      # 两处，而且是容易忘的一处）。这里只钉「本次专门为了 Windows 让步的两条」，
      # 它们对应 `channel_full_chain_test`，跨平台覆盖全押在 test-macos 上。
      - name: 断言这些 ignore 真的生效（不能变回静默通过）
        shell: bash
        run: |
          cargo test -- --list --ignored 2>/dev/null \
            | grep ': test$' | sed 's/: test$//' | sort > /tmp/ignored.txt
          echo "── Windows 上被 ignore 的全部用例（$(wc -l < /tmp/ignored.txt) 条）──"
          cat /tmp/ignored.txt
          # 这份名单对应「靠 python 假渠道跑真 MCP 协议」的那批：Windows 上脚本起得来，
          # 但非 tty 的 stdin 行迭代拿不到首行，请求等到 EOF。改不了就得看得见。
          for want in \
            channel_full_chain_test::build_for_mcp_bot_produces_working_messenger \
            channel_full_chain_test::build_source_and_tick_deliver_from_real_channel \
            mcp_bus_e2e_test::subscribe_end_to_end_reaches_ev \
            mcp_bus_e2e_test::send_text_end_to_end_reaches_the_server \
            mcp_channel_dir_e2e_test::dir_channel_receives_and_translates \
            mcp_channel_dir_e2e_test::dir_channel_sends_to_outbox \
            mcp_channel_dir_e2e_test::dir_channel_bad_message_does_not_block_later_ones \
          ; do
            if ! grep -qx "$want" /tmp/ignored.txt; then
              echo "❌ $want 不在 ignore 清单里——它要么被删了，要么 ignore 属性失效了"
              exit 1
            fi
          done
          echo "✅ 7 条 MCP 假渠道用例已显式 ignore（由 test-macos 真实执行）"

  # macOS 特有代码（configure_backend 的 cfg(target_os="macos") 分支、SLINT_BACKEND
  # 经 BackendSelector 的选择路径、透明标题栏钩子）只在本平台编译；windows job 覆盖
  # 不到，这里补**编译**验证。渲染器去 skia 后 macOS 冷构建无需外部 C++ 工具链。
  # 注意：本 job 只 cargo check，不跑测试——真正跑测试的是下面的 test-macos。
  check-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # slint-pixel 是本地 path 依赖（../slint-pixel），CI 需一并拉取（public 仓库）
      - name: Checkout slint-pixel (path dep)
        uses: actions/checkout@v4
        with:
          repository: gqf2008/slint-pixel
          path: slint-pixel

      # checkout 不允许 path 出 workspace（../slint-pixel 被拒），先落 workspace 内再移出
      - name: Move slint-pixel to ../ (cargo path dep)
        shell: bash
        run: mv slint-pixel ../slint-pixel
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2

      - name: cargo check（macOS cfg 分支编译验证）
        run: cargo check --all-targets

  # #317：上面的 test job 跑在 **windows-latest**，而所有依赖 tests/mock_acp_agent.py
  # （需 python3）的端到端用例都带 cfg_attr(windows, ignore) —— 于是它们**在 CI 里从未执行**
  # （PR #316 的日志：628 passed / 18 ignored），「CI 全绿」对 harness/桥接的端到端路径
  # 不构成验证。这里在 macOS 上补一次真实运行（macOS runner 自带 python3）。
  # 保留 windows 的 test job：Windows 特有分支（控制台窗口/Job 语义等）仍需在那跑。
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # slint-pixel 是本地 path 依赖（../slint-pixel），CI 需一并拉取（public 仓库）
      - name: Checkout slint-pixel (path dep)
        uses: actions/checkout@v4
        with:
          repository: gqf2008/slint-pixel
          path: slint-pixel

      - name: Move slint-pixel to ../ (cargo path dep)
        shell: bash
        run: mv slint-pixel ../slint-pixel
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2

      - name: cargo test（macOS：含依赖 mock agent 的端到端用例）
        # 同 windows job：带 `--show-output` 才能看见被跳过的用例给出的 `[skip]` 理由。
        run: cargo test -- --show-output

      # 诊断（只在失败时跑，不参与判绿）：`share_icon_renders_actual_glyphs_not_tofu`
      # 在 macos-latest 上红。那条用例的注释已经把口径写死了：「严格模式下不得跳过——
      # 若确属 CI 镜像字体变化，请当成环境变更处理」，所以**不能**放宽判据，得先弄清
      # 这个环境到底看得见哪些字体（fontique 集合里有没有 emoji 族），才能决定怎么补。
      - name: 诊断（emoji 字体环境）
        if: failure()
        shell: bash
        run: |
          echo "── 系统里的 emoji 字体文件 ──"
          ls -la /System/Library/Fonts/ 2>/dev/null | grep -i emoji || echo "(系统目录无 emoji 字体)"
          ls -la ~/Library/Fonts/ 2>/dev/null | grep -i emoji || echo "(用户目录无 emoji 字体)"
          echo "── 旁证：fc-list 能看到的 emoji ──"
          fc-list 2>/dev/null | grep -i emoji || echo "(无 fc-list 或无 emoji)"
          echo "── CI 镜像版本 ──"
          sw_vers
