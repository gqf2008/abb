name: CI

# PR / main 推送 / 手动触发：clippy -D warnings 门禁 + 全量测试 + macOS 编译验证。
# 仓库此前只有 release.yml（打 tag 发版），没有 PR 级门禁；本工作流补这个缺口。
# test job 跑 windows-latest：与开发主环境一致；macOS 特有代码（ui.rs 里
# configure_backend 的 cfg(target_os="macos") 分支、winit 窗口属性钩子）由
# check-macos job 补编译验证（渲染器已去 skia，冷构建不再需要 ninja/clang）。
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # fmt 独立小 job：不编译，秒级反馈。
  # 注意：仓库基线在现行 stable rustfmt 下有 68 处历史格式漂移（先于本工作流存在），
  # 统一重排属单独议题；在此之前 continue-on-error 顾问运行（有注解，不卡合并）。
  fmt:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # slint-pixel 是本地 path 依赖（../slint-pixel），CI 需一并拉取（public 仓库）
      - name: Checkout slint-pixel (path dep)
        uses: actions/checkout@v4
        with:
          repository: gqf2008/slint-pixel
          path: slint-pixel

      # checkout 不允许 path 出 workspace（../slint-pixel 被拒），先落 workspace 内再移出
      - name: Move slint-pixel to ../ (cargo path dep)
        shell: bash
        run: mv slint-pixel ../slint-pixel
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  # fork buzz-agent 是独立包（自有 manifest + lock，不挂 root workspace），root 的
  # clippy/fmt 覆盖不到它——v2.23.24 就带着一个 `#[cfg(unix)]` 测试里的 unused
  # variable 上了 main（本地门禁红、远程 CI 全绿）。这里补 PR 级门禁。
  # 选 macOS 只为与本地门禁同平台、少一类环境差异（Linux 同为 cfg(unix)，同样
  # 能编到那段测试代码；fork 的 cfg(windows) 测试代码在两边都不被编译，属既有盲区）。
  fork-lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/buzz-agent

      # --all 不含独立包，必须显式 manifest-path
      - name: fmt（fork）
        run: cargo fmt --check --manifest-path crates/buzz-agent/Cargo.toml

      # --all-targets 关键：只 lint 非测试构建时，测试代码里的违例（正是这次的
      # unused variable）永远漏网
      - name: clippy（fork，-D warnings 门禁）
        run: cargo clippy --locked --manifest-path crates/buzz-agent/Cargo.toml --all-targets -- -D warnings

      # 测试只编译不执行：fork 尚存两条已知 flaky（一条 steer 时序、一条 cancel 竞争，
      # 账在 docs/buzz-port-sync.md「已知 flaky」节），真跑会间歇红；--no-run 已能抓住
      # 「测试代码编不过 / 新 cfg 形态漏编译」这类回归（v2.23.24 的 unused variable 即属
      # 此类）。逻辑回归仍由本地全量门禁负责。
      - name: test 编译（fork，--no-run）
        run: cargo test --locked --manifest-path crates/buzz-agent/Cargo.toml --no-run

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # slint-pixel 是本地 path 依赖（../slint-pixel），CI 需一并拉取（public 仓库）
      - name: Checkout slint-pixel (path dep)
        uses: actions/checkout@v4
        with:
          repository: gqf2008/slint-pixel
          path: slint-pixel

      # checkout 不允许 path 出 workspace（../slint-pixel 被拒），先落 workspace 内再移出
      - name: Move slint-pixel to ../ (cargo path dep)
        shell: bash
        run: mv slint-pixel ../slint-pixel
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: clippy（-D warnings 门禁）
        run: cargo clippy --all-targets -- -D warnings

      - name: test（全量测试）
        run: cargo test

  # macOS 特有代码（configure_backend 的 cfg(target_os="macos") 分支、SLINT_BACKEND
  # 经 BackendSelector 的选择路径、透明标题栏钩子）只在本平台编译；windows job 覆盖
  # 不到，这里补编译验证。渲染器去 skia 后 macOS 冷构建无需外部 C++ 工具链。
  check-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # slint-pixel 是本地 path 依赖（../slint-pixel），CI 需一并拉取（public 仓库）
      - name: Checkout slint-pixel (path dep)
        uses: actions/checkout@v4
        with:
          repository: gqf2008/slint-pixel
          path: slint-pixel

      # checkout 不允许 path 出 workspace（../slint-pixel 被拒），先落 workspace 内再移出
      - name: Move slint-pixel to ../ (cargo path dep)
        shell: bash
        run: mv slint-pixel ../slint-pixel
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: cargo check（macOS cfg 分支编译验证）
        run: cargo check --all-targets

  # #317：上面的 test job 跑在 **windows-latest**，而所有依赖 tests/mock_acp_agent.py
  # （需 python3）的端到端用例都带 cfg_attr(windows, ignore) —— 于是它们**在 CI 里从未执行**
  # （PR #316 的日志：628 passed / 18 ignored），「CI 全绿」对 harness/桥接的端到端路径
  # 不构成验证。这里在 macOS 上补一次真实运行（macOS runner 自带 python3）。
  # 保留 windows 的 test job：Windows 特有分支（控制台窗口/Job 语义等）仍需在那跑。
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # slint-pixel 是本地 path 依赖（../slint-pixel），CI 需一并拉取（public 仓库）
      - name: Checkout slint-pixel (path dep)
        uses: actions/checkout@v4
        with:
          repository: gqf2008/slint-pixel
          path: slint-pixel

      - name: Move slint-pixel to ../ (cargo path dep)
        shell: bash
        run: mv slint-pixel ../slint-pixel
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: cargo test（macOS：含依赖 mock agent 的端到端用例）
        run: cargo test

      # 可见性：把「被 ignore 的用例」显式列出来，避免再出现「绿但其实没跑」
      - name: 列出被 ignore 的用例
        if: always()
        shell: bash
        run: cargo test -- --list --ignored || true
