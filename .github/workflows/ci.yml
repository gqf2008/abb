name: CI

# PR / main 推送 / 手动触发：clippy -D warnings 门禁 + 全量测试 + macOS 编译验证。
# 仓库此前只有 release.yml（打 tag 发版），没有 PR 级门禁；本工作流补这个缺口。
# test job 跑 windows-latest：与开发主环境一致；macOS 特有代码（ui.rs 里
# configure_backend 的 cfg(target_os="macos") 分支、winit 窗口属性钩子）由
# check-macos job 补编译验证（渲染器已去 skia，冷构建不再需要 ninja/clang）。
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # fmt 独立小 job：不编译，秒级反馈。
  # 注意：仓库基线在现行 stable rustfmt 下有 68 处历史格式漂移（先于本工作流存在），
  # 统一重排属单独议题；在此之前 continue-on-error 顾问运行（有注解，不卡合并）。
  fmt:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: clippy（-D warnings 门禁）
        run: cargo clippy --all-targets -- -D warnings

      - name: test（全量测试）
        run: cargo test

  # macOS 特有代码（configure_backend 的 cfg(target_os="macos") 分支、SLINT_BACKEND
  # 经 BackendSelector 的选择路径、透明标题栏钩子）只在本平台编译；windows job 覆盖
  # 不到，这里补编译验证。渲染器去 skia 后 macOS 冷构建无需外部 C++ 工具链。
  check-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: cargo check（macOS cfg 分支编译验证）
        run: cargo check --all-targets
