name: Build & Release

# 打 tag v* 时自动构建 macOS + Windows，签名/公证后发 GitHub Release；也可手动触发。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ─────────────────────────── macOS（Apple Silicon）───────────────────────────
  macos:
    # 2026-09-22：macos-14 镜像更新到 14.8.9 后，codesign 对大二进制（~150MB
    # agent-bridge）签名时 SecKeyCreateSignature 在 securityd 内无界挂起（sample
    # 栈实证：SGN_SignAll → SecKeyCreateSignature → SecKeyCopyDigestForMessage；
    # 小文件/preflight 秒过，同一二进制在旧镜像 2.23.62 秒签）。切 macos-15
    # （arm64）绕开该 securityd 回归。
    runs-on: macos-15 # Apple Silicon（arm64），与本地 aarch64 产物一致
    # 2.23.63 教训：本 job 时长下界 = ABB 本体 release 重建（LTO / codegen-units=1）+ 随包
    # jq 从官方源码构建 + 签名/公证；当时曾跑 2.5h+ 无进展。加硬超时让异常快速失败
    # （正常应在 ~60min 内），而不是烧到 GitHub 默认 6h。
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # slint-pixel 是本地 path 依赖（../slint-pixel），CI 需一并拉取（public 仓库）
      - name: Checkout slint-pixel (path dep)
        uses: actions/checkout@v4
        with:
          repository: gqf2008/slint-pixel
          path: slint-pixel

      # checkout 不允许 path 出 workspace（../slint-pixel 被拒），先落 workspace 内再移出
      - name: Move slint-pixel to ../ (cargo path dep)
        shell: bash
        run: mv slint-pixel ../slint-pixel

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: aarch64-apple-darwin

      # 证书导入 + 签名预检必须在两次 cargo build 之前（评审 needs-changes 修正）：
      # 坏宿主机 2 分钟内显式失败（重跑 job 即可换宿主机），不再烧 15 分钟构建
      # 再挂在签名上。
      - name: Import Developer ID certificate (temporary keychain)
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "$APPLE_CERT_P12" | base64 --decode > /tmp/cert.p12
          security create-keychain -p temp /tmp/temp.keychain
          security default-keychain -s /tmp/temp.keychain
          security unlock-keychain -p temp /tmp/temp.keychain
          security import /tmp/cert.p12 -k /tmp/temp.keychain -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k temp /tmp/temp.keychain
          # 记录签名身份（供后续 codesign 用）
          IDENTITY=$(security find-identity -v -p codesigning | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      # 2026-09-22 实锤（诊断日志）：GitHub macOS 宿主机约半数到 Apple 签名设施的
      # 链路坏（codesign --timestamp 无界挂起；同机 ad-hoc/真证书签小文件实测秒过，
      # 坏宿主机的连接被拒后 codesign 内部无界重试）。构建前用真证书 + --timestamp
      # 签一个探针文件：坏宿主机 2 分钟内显式失败（重跑 job 即可换宿主机）。
      - name: Sign preflight（真证书 + --timestamp 快速探针；坏宿主机在此快速失败）
        run: |
          printf 'x' > /tmp/sign-preflight
          perl -e 'alarm 120; exec @ARGV' codesign --force --options runtime --timestamp --sign "$IDENTITY" /tmp/sign-preflight
          codesign -v --verbose=1 /tmp/sign-preflight | head -3

      - name: Build release (aarch64)
        run: cargo build --release --target aarch64-apple-darwin

      # 随包执行层 abb-agent = ki（pi-rust 构建后改名分发，2026-10-23）。
      # 名字不变是刻意的：解析链（BUNDLED_AGENT）与签名/安装路径全部零改动。
      # 钉 SHA 保证可复现；升版时与 release notes 一起 bump。
      # 旧实现 crates/abb-agent 保留在树内待退役（阶段 3，单独批次）。
      #
      # **ref 必须是完整 40 位 SHA**：actions/checkout 把 ref 当分支/标签名去 fetch
      # （`+refs/heads/<ref>*`），短 SHA 两者都不是 ⇒ 两个 job 都红在 checkout
      # （2026-10-23 首次真跑实测）。另外该 SHA 必须已推到 GitHub 镜像——只存在于
      # walgit 的提交，CI 里根本不存在（同次实测）。
      - name: Checkout pi-rust (ki source)
        uses: actions/checkout@v4
        with:
          repository: gqf2008/pi-rust
          ref: 941b750019c2fa59d3325899610eb0aa624e3d9e
          path: pi-rust-src

      - name: Build ki as abb-agent (aarch64)
        run: |
          cd pi-rust-src
          cargo build --release --locked -p kiqi-cli --target aarch64-apple-darwin

      # abb-chart（图形生成）：agent 用 `"$ABB_BIN" chart render …` 出图后 deliver 发回聊天。
      # 独立包/独立产物（charton 要 rustc≥1.85，且渲染 panic 不该砸托盘进程）。
      - name: Build abb-chart (aarch64)
        run: cargo build --release --manifest-path crates/abb-chart/Cargo.toml --target aarch64-apple-darwin

      - name: Assemble ABB.app and sign (hardened runtime + timestamp)
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # Info.plist 版本号与 Cargo.toml 保持一致
          sed -i '' "s|<string>2\.[0-9]*\.[0-9]*</string>|<string>$VERSION</string>|g" app-assets/Info.plist
          mkdir -p ABB.app/Contents/MacOS ABB.app/Contents/Resources
          cp target/aarch64-apple-darwin/release/agent-bridge ABB.app/Contents/MacOS/
          # 2026-10-04 去提权：abb-helper（#129 锁屏特权助手）已随 v2.23.95 删除 ——
          # 这里不再拷贝它（旧写法是在这一步 cp 一个已不存在的产物，CI 直接失败）。
          # abb-agent（单一执行层，刀 4b 后 buzz-agent 已删）。
          cp pi-rust-src/target/aarch64-apple-darwin/release/ki ABB.app/Contents/MacOS/abb-agent
          # abb-chart（图形生成，卡 abb-chart-cli-20261013）：与 abb-agent 同目录随包，
          # 由 `agent-bridge chart` 转发调用（同目录查找见 src/main.rs::bundled_chart_path_in）。
          cp crates/abb-chart/target/aarch64-apple-darwin/release/abb-chart ABB.app/Contents/MacOS/
          cp LICENSE ABB.app/Contents/Resources/ABB-LICENSE.txt
          cp app-assets/Info.plist ABB.app/Contents/Info.plist
          cp app-assets/AppIcon.icns ABB.app/Contents/Resources/ 2>/dev/null || true
          # 随包工具：版本/URL/SHA256 锁在 tools/tool-lock.tsv；不含 git/bun/sed/find。
          bash tools/fetch_bundled_tools.sh --platform macos-arm64 \
            --dest ABB.app/Contents/Resources/tools
          bash tools/check_bundled_tools.sh --platform macos-arm64 \
            --bin-dir ABB.app/Contents/Resources/tools/bin
          # 2026-09-22：GitHub runner 出网到 Apple 时间戳服务器偶发挂起，codesign
          # --timestamp 无界重试（实测挂 96 分钟烧穿 job；诊断确认：坏宿主机连接被拒
          # 后 codesign 内部无界重试，约半数宿主机受影响）。给每次签名加 180s 看门狗
          # （perl alarm 随 exec 继承）+ 两次重试：失败快速显式退出，重跑 job 换宿主机。
          sign() {
            local attempt
            for attempt in 1 2 3; do
              # 临时 keychain 可能在导入后 20+ 分钟自动锁定：securityd 等解锁提示 =
              # 无头 CI 里静默挂起（与 diag3 sample 栈一致：SecKeyCreateSignature 挂
              # 等 securityd；preflight 紧贴导入时秒过、真签名 25 分钟后挂）。
              # 每次尝试前强制解锁 + 禁用自动锁。
              security unlock-keychain -p temp /tmp/temp.keychain 2>/dev/null || true
              security set-keychain-settings -lut 21600 /tmp/temp.keychain 2>/dev/null || true
              if perl -e 'alarm shift; exec @ARGV' 180 codesign "$@"; then
                return 0
              fi
              echo "⚠️ codesign 失败/超时（第 ${attempt}/2 次），10s 后重试：$*" >&2
              sleep 10
            done
            echo "❌ codesign 两次失败（签名或 Apple 时间戳服务不可达）" >&2
            return 1
          }
          # #251：--options runtime（hardened runtime）必须与 --entitlements 配套——
          # 缺 camera/audio-input/apple-events entitlement 时 tccd 对摄像头/麦克风
          # 直接 deny 且不允许弹窗。主可执行与 bundle 双层都带（codesign 对 bundle
          # 的 entitlements 不会从内层继承；TCC 责任进程链在 macOS 各版本上取
          # 主可执行与 bundle 签名不一，双层带最稳）。
          ENT="app-assets/abb.entitlements"
          sign --force --options runtime --timestamp --entitlements "$ENT" --sign "$IDENTITY" ABB.app/Contents/MacOS/agent-bridge
          # abb-agent 也会 spawn shell / MCP 子进程并可能触发 TCC（#251）。
          sign --force --options runtime --timestamp --entitlements "$ENT" --sign "$IDENTITY" ABB.app/Contents/MacOS/abb-agent
          # abb-chart 不 spawn 子进程、不碰 TCC，但必须签名：hardened runtime 下未签名的
          # 内部可执行会被 Gatekeeper 拦（`agent-bridge chart` 转发直接失败）。带上 entitlements
          # 与其它内部可执行保持一致（多签不影响，少签才是静默失败）。
          sign --force --options runtime --timestamp --entitlements "$ENT" --sign "$IDENTITY" ABB.app/Contents/MacOS/abb-chart
          # 随包工具清单从 tools/tool-lock.tsv 生成（唯一事实源）——不再另手抄一份枚举，
          # 否则加/删工具时会静默漏签（`--require-bundled-tools` 只查 PATH 解析、不查签名）。
          # 签名清单 = tool-lock 的包产物名 **∪** 多调包按名暴露的工具名，**按平台过滤**
          # （评审 F1：第一个版本漏了平台过滤，会把 Windows 专属的 ps/watch/wget/… 也拿去签，
          #  codesign 对不存在的路径返回 1 ⇒ macOS release job 在签名循环就死）。
          # 先做集合断言：签名清单必须与目录里实际存在的文件**逐一相等**（这条断言同时拦住
          # "漏签一个名字"与"签一个不存在的名字"两类事故）。
          tools_bin="ABB.app/Contents/Resources/tools/bin"
          {
            awk -F'\t' '$3=="macos-arm64" && $1!="tool" {print $8}' tools/tool-lock.tsv
            awk -F'\t' 'NR>1 && ($3=="all" || $3=="macos-arm64") {print $1}' tools/bundled-cli-tools.tsv
          } | sort -u > /tmp/abb-sign-list.txt
          ls "$tools_bin" | sort -u > /tmp/abb-tools-actual.txt
          if ! diff -u /tmp/abb-sign-list.txt /tmp/abb-tools-actual.txt; then
            echo "❌ 签名清单与随包工具目录不一致（漏签/多签）" >&2
            exit 1
          fi
          for tool in $(cat /tmp/abb-sign-list.txt); do
            sign --force --options runtime --timestamp --sign "$IDENTITY" "$tools_bin/$tool"
          done
          sign --force --options runtime --timestamp --entitlements "$ENT" --sign "$IDENTITY" ABB.app
          codesign --verify --deep --strict --verbose=2 ABB.app
          # #251 守卫：三项 TCC entitlements（相机/麦克风/自动化）必须真的签进产物——
          # 缺任一项在 hardened runtime 下会被**静默拒绝**（连授权弹窗都没有），
          # 历史上只有真机点相机才发现。分发包与内部可执行都要查。
          bash tools/check_entitlements.sh ABB.app
          ./ABB.app/Contents/MacOS/agent-bridge --dump-tools --require-bundled-tools

      - name: Notarize + staple app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ditto -c -k --keepParent ABB.app /tmp/ABB-notarize.zip
          xcrun notarytool submit /tmp/ABB-notarize.zip \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple ABB.app
          spctl --assess --type execute --verbose=4 ABB.app || true

      - name: Package DMG (drag to Applications) + sign + notarize + staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          # 标准拖拽安装盘：ABB.app + Applications 快捷方式
          mkdir -p dmg-staging
          cp -R ABB.app dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "ABB" -srcfolder dmg-staging -ov -format UDZO "ABB-$VERSION.dmg"
          # DMG 也要签名 + 公证（只公证 app 不够，分发的盘片本身要过 Gatekeeper）。
          # 同 Assemble 步：codesign 经 180s 看门狗（Apple 时间戳服务偶发挂起）。
          if ! perl -e 'alarm 180; exec @ARGV' codesign --force --sign "$IDENTITY" --timestamp "ABB-$VERSION.dmg"; then
            echo "⚠️ DMG 签名失败/超时，重试一次" >&2
            sleep 10
            perl -e 'alarm 180; exec @ARGV' codesign --force --sign "$IDENTITY" --timestamp "ABB-$VERSION.dmg" || exit 1
          fi
          xcrun notarytool submit "ABB-$VERSION.dmg" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "ABB-$VERSION.dmg"
          spctl --assess --type open --context context:primary-signature -v "ABB-$VERSION.dmg" || true

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dist
          path: ABB-*.dmg
          if-no-files-found: error

  # ─────────────────────────── Windows（x64 + Inno Setup）───────────────────────────
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # slint-pixel 是本地 path 依赖（../slint-pixel），CI 需一并拉取（public 仓库）
      - name: Checkout slint-pixel (path dep)
        uses: actions/checkout@v4
        with:
          repository: gqf2008/slint-pixel
          path: slint-pixel

      # checkout 不允许 path 出 workspace（../slint-pixel 被拒），先落 workspace 内再移出
      - name: Move slint-pixel to ../ (cargo path dep)
        shell: bash
        run: mv slint-pixel ../slint-pixel

      - uses: dtolnay/rust-toolchain@1.99.0

      - name: Build release
        run: cargo build --release

      # 随包执行层 abb-agent = ki（pi-rust 构建后改名分发，2026-10-23；与 macOS 同位钉 SHA）。
      # 落点保持 crates/abb-agent/target/release/abb-agent.exe——ABB.iss 与 CRT 守卫按此取件。
      # 完整 40 位 SHA 与 GitHub 镜像前置条件见 macOS 侧同款步骤的注释。
      - name: Checkout pi-rust (ki source)
        uses: actions/checkout@v4
        with:
          repository: gqf2008/pi-rust
          ref: 941b750019c2fa59d3325899610eb0aa624e3d9e
          path: pi-rust-src

      # #331：pi-rust 仓库不带 .cargo/config.toml（本地文件），Windows 分发必须显式
      # static CRT，否则 VCRUNTIME140.dll 依赖会让干净机器起不来（与 abb 自身同款守卫）。
      - name: Build ki as abb-agent (+crt-static, #331)
        shell: bash
        run: |
          cd pi-rust-src
          RUSTFLAGS="-C target-feature=+crt-static" cargo build --release --locked -p kiqi-cli
          mkdir -p ../crates/abb-agent/target/release
          cp target/release/ki.exe ../crates/abb-agent/target/release/abb-agent.exe

      # abb-chart（图形生成，卡 abb-chart-cli-20261013）：`agent-bridge chart` 转发调用它。
      - name: Build abb-chart
        run: cargo build --release --manifest-path crates/abb-chart/Cargo.toml

      # #331 守卫：**分发的产物**不许依赖 VC++ Redistributable。
      # 背景：用户首次安装即报「找不到 VCRUNTIME140.dll」——MSVC 默认动态 CRT，
      # 而这两个 DLL 来自 Redist，干净 Windows 上没有。修法见 .cargo/config.toml
      # 的 +crt-static；这条守卫保证「修完不许回退」。**三个 exe 都要查**：
      # abb-agent.exe 由 agent-bridge 派生运行，abb-chart.exe 由 `agent-bridge chart` 转发运行
      # ——两者都缺 DLL 的话，会在第一次真用到时才炸（装完第一次聊天看不出问题）。
      # 守卫本身已用「坏样本/好样本」在本机验过会红/会绿（tools/check_dynamic_crt.sh）。
      - name: Assert no dynamic CRT dependency (#331)
        shell: bash
        run: |
          bash tools/check_dynamic_crt.sh \
            target/release/agent-bridge.exe \
            crates/abb-agent/target/release/abb-agent.exe \
            crates/abb-chart/target/release/abb-chart.exe
          # 可见性：把真实导入表打出来（llvm-objdump 随 rustup，取不到就跳过，不阻塞）
          if rustup component add llvm-tools-preview >/dev/null 2>&1; then
            OBJDUMP=$(find "$(rustc --print sysroot)" -type f -name 'llvm-objdump*' 2>/dev/null | head -1)
            if [ -n "$OBJDUMP" ]; then
              for f in target/release/agent-bridge.exe crates/abb-agent/target/release/abb-agent.exe crates/abb-chart/target/release/abb-chart.exe; do
                echo "── $f 的导入表："
                "$OBJDUMP" -p "$f" | grep -i "DLL Name" || true
              done
            fi
          fi

      - name: Fetch bundled tools
        shell: pwsh
        run: ./tools/fetch_bundled_tools.ps1 -Platform windows-x64 -Dest tools-dist

      # 随包工具齐不齐由**同一份** checker 断言（多调包一个包暴露多个名字，只看包产物查不出来）。
      - name: Check bundled CLI tools (windows-x64)
        shell: bash
        run: bash tools/check_bundled_tools.sh --platform windows-x64 --bin-dir tools-dist/bin

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if (-not $iscc) {
            choco install innosetup -y --no-progress
          }
          # choco 的 innosetup 包可能缺中文语言文件，缺就从官方 issrc 补
          $langDir = "C:\Program Files (x86)\Inno Setup 6\Languages"
          if (-not (Test-Path "$langDir\ChineseSimplified.isl")) {
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl" -OutFile "$langDir\ChineseSimplified.isl"
          }
          Write-Host "ISCC found: $((Get-Command ISCC.exe).Source)"

      - name: Build installer
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          Write-Host "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          & ISCC.exe /DMyAppVersion=$version app-assets\ABB.iss

      - name: Assert installer filename matches the version (#374)
        # 2026-10-05 发版实测：这一步原先排在 "Build installer" **之前** ⇒ Test-Path 必然
        # 失败，任何 tag 发版都会在 windows 上红。断言必须在产物生成后再跑。
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' ).Matches[0].Groups[1].Value
          $want = "app-assets/Output/ABB-Setup-$v.exe"
          if (-not (Test-Path $want)) {
            Write-Error "安装包文件名与版本不一致：期望 $want，实际 $(Get-ChildItem app-assets/Output/ABB-Setup-*.exe | Select-Object -ExpandProperty Name)"
            exit 1
          }
          Write-Host "✓ 安装包名与版本一致：$want"

      # Windows 代码签名：有证书时启用（Azure Trusted Signing 或 EV），否则跳过。
      # 注意：secrets 不能出现在 if 条件里（workflow 会解析失败），所以运行时判断。
      - name: Sign installer (optional)
        shell: pwsh
        env:
          WIN_SIGN_PFX: ${{ secrets.WIN_SIGN_PFX }}
          WIN_SIGN_PASSWORD: ${{ secrets.WIN_SIGN_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:WIN_SIGN_PFX)) {
            Write-Host "未配置 WIN_SIGN_PFX，跳过 Windows 代码签名"
            exit 0
          }
          $pfx = [IO.File]::WriteAllBytes("$env:TEMP\cert.pfx", [Convert]::FromBase64String($env:WIN_SIGN_PFX))
          & signtool sign /f $pfx /p $env:WIN_SIGN_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            (Get-ChildItem app-assets\Output\ABB-Setup-*.exe | Select-Object -First 1).FullName

      - uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: app-assets/Output/ABB-Setup-*.exe
          if-no-files-found: error

  # ─────────────────────────── 汇总发 Release ───────────────────────────
  release:
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/v') # 只有打 tag 才发 Release；手动跑只出产物
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # 生成 SHA256SUMS 校验清单并一并上传：客户端升级时下载后先校验哈希，
      # 不匹配/清单缺失一律拒绝安装（updater verify_sha256 fail-closed）。
      # 注意：清单与产物同渠道分发，防的是传输损坏与资产被换；真正的信任根仍是
      # Apple 公证 / Windows Authenticode（有证书配置时），本清单是完整性兜底。
      - name: Generate SHA256SUMS
        shell: bash
        run: |
          cd dist
          sha256sum ABB-*.dmg ABB-Setup-*.exe > SHA256SUMS
          cat SHA256SUMS

      - name: Prepare release notes (auto-generated + 架构提示)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 先用 GitHub API 生成基于提交历史的 release notes，再在开头插入架构说明
          gh api -X POST "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="${{ github.ref_name }}" -f target_commitish="${{ github.sha }}" \
            -q '.body' > /tmp/notes-generated.md
          printf '%s\n' '> ⚠️ **macOS 版仅支持 Apple Silicon（M 系列，arm64）**；Intel Mac 请勿下载。' | cat - /tmp/notes-generated.md > /tmp/notes-final.md

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: /tmp/notes-final.md
          fail_on_unmatched_files: true
