name: Build & Release

# 打 tag v* 时自动构建 macOS + Windows，签名/公证后发 GitHub Release；也可手动触发。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ─────────────────────────── macOS（Apple Silicon）───────────────────────────
  macos:
    runs-on: macos-14 # Apple Silicon（arm64），与本地 aarch64 产物一致
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Build release (aarch64)
        run: cargo build --release --target aarch64-apple-darwin

      - name: Import Developer ID certificate (temporary keychain)
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "$APPLE_CERT_P12" | base64 --decode > /tmp/cert.p12
          security create-keychain -p temp /tmp/temp.keychain
          security default-keychain -s /tmp/temp.keychain
          security unlock-keychain -p temp /tmp/temp.keychain
          security import /tmp/cert.p12 -k /tmp/temp.keychain -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k temp /tmp/temp.keychain
          # 记录签名身份（供后续 codesign 用）
          IDENTITY=$(security find-identity -v -p codesigning | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Assemble ABB.app and sign (hardened runtime + timestamp)
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # Info.plist 版本号与 Cargo.toml 保持一致
          sed -i '' "s|<string>2\.[0-9]*\.[0-9]*</string>|<string>$VERSION</string>|g" app-assets/Info.plist
          mkdir -p ABB.app/Contents/MacOS ABB.app/Contents/Resources
          cp target/aarch64-apple-darwin/release/agent-bridge ABB.app/Contents/MacOS/
          cp app-assets/Info.plist ABB.app/Contents/Info.plist
          cp app-assets/AppIcon.icns ABB.app/Contents/Resources/ 2>/dev/null || true
          codesign --force --options runtime --timestamp --sign "$IDENTITY" ABB.app/Contents/MacOS/agent-bridge
          codesign --force --options runtime --timestamp --sign "$IDENTITY" ABB.app
          codesign --verify --deep --strict --verbose=2 ABB.app

      - name: Notarize + staple + zip
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ditto -c -k --keepParent ABB.app /tmp/ABB-notarize.zip
          xcrun notarytool submit /tmp/ABB-notarize.zip \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple ABB.app
          ditto -c -k --keepParent ABB.app "ABB-$VERSION-notarized.zip"
          spctl --assess --type execute --verbose=4 ABB.app || true

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dist
          path: ABB-*.zip
          if-no-files-found: error

  # ─────────────────────────── Windows（x64 + Inno Setup）───────────────────────────
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if (-not $iscc) {
            choco install innosetup -y --no-progress
          }
          Write-Host "ISCC found: $((Get-Command ISCC.exe).Source)"

      - name: Build installer
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          Write-Host "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          & ISCC.exe /DMyAppVersion=$version installer\ABB.iss

      # Windows 代码签名：有证书时启用（Azure Trusted Signing 或 EV），否则跳过。
      # 注意：secrets 不能出现在 if 条件里（workflow 会解析失败），所以运行时判断。
      - name: Sign installer (optional)
        shell: pwsh
        env:
          WIN_SIGN_PFX: ${{ secrets.WIN_SIGN_PFX }}
          WIN_SIGN_PASSWORD: ${{ secrets.WIN_SIGN_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:WIN_SIGN_PFX)) {
            Write-Host "未配置 WIN_SIGN_PFX，跳过 Windows 代码签名"
            exit 0
          }
          $pfx = [IO.File]::WriteAllBytes("$env:TEMP\cert.pfx", [Convert]::FromBase64String($env:WIN_SIGN_PFX))
          & signtool sign /f $pfx /p $env:WIN_SIGN_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            (Get-ChildItem installer\Output\ABB-Setup-*.exe | Select-Object -First 1).FullName

      - uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: installer/Output/ABB-Setup-*.exe
          if-no-files-found: error

  # ─────────────────────────── 汇总发 Release ───────────────────────────
  release:
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/v') # 只有打 tag 才发 Release；手动跑只出产物
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
