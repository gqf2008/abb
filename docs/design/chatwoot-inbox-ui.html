<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chatwoot · 交互原型（多页面）</title>
<!--
  Chatwoot v4.18 仪表盘交互原型 —— 供 ABB 借鉴参考
  · 多页面（hash 路由）+ 真交互（发消息/私密备注/解决/分配/筛选/命令面板/设置）
  · 配色令牌取自 app/javascript/dashboard/assets/scss/_next-colors.scss
  · 消息气泡语义取自 components-next/message/bubbles/Base.vue
  仅用于 UI 参考，非官方产物。
-->
<style>
/* ══════════════════════════════════════════════════════════
   1. 设计令牌（Chatwoot 原样 Radix 色阶）
   ══════════════════════════════════════════════════════════ */
:root{
  --slate-1:252 252 253;--slate-2:249 249 251;--slate-3:240 240 243;--slate-4:232 232 236;
  --slate-5:224 225 230;--slate-6:217 217 224;--slate-7:205 206 214;--slate-8:185 187 198;
  --slate-9:139 141 152;--slate-10:128 131 141;--slate-11:96 100 108;--slate-12:28 32 36;
  --iris-2:248 248 255;--iris-3:240 241 254;--iris-4:230 231 255;--iris-9:91 91 214;
  --iris-10:81 81 205;--iris-11:87 83 198;--iris-12:39 41 98;
  --blue-2:245 249 255;--blue-3:233 243 255;--blue-4:218 236 255;--blue-9:39 129 246;
  --blue-10:16 115 233;--blue-11:8 109 224;--blue-12:11 50 101;
  --ruby-3:254 234 237;--ruby-4:255 220 225;--ruby-9:229 70 102;--ruby-11:202 36 77;--ruby-12:100 23 43;
  --amber-2:254 251 233;--amber-3:255 247 194;--amber-4:255 238 156;--amber-9:255 197 61;
  --amber-11:171 100 0;--amber-12:79 52 34;
  --teal-2:243 251 249;--teal-3:224 248 243;--teal-9:18 165 148;--teal-11:0 133 115;--teal-12:13 61 56;
  --violet-2:250 248 255;--violet-3:244 240 254;--violet-9:110 86 207;--violet-11:101 85 183;--violet-12:47 38 95;
  --green-3:230 244 234;--green-9:48 164 108;--green-11:33 131 88;
  --background-color:247 247 247;--surface-1:254 254 254;--surface-2:255 255 255;
  --solid-1:255 255 255;--solid-2:255 255 255;--solid-3:255 255 255;
  --solid-blue:218 236 255;--solid-amber:255 228 181;--solid-iris:230 231 255;--solid-red:254 200 201;
  --border-container:236 236 236;--border-strong:226 227 231;--border-weak:234 234 234;

  --bg:rgb(var(--background-color)); --panel:rgb(var(--surface-2)); --panel-2:rgb(var(--surface-1));
  --hover:rgb(var(--slate-3)); --press:rgb(var(--slate-4));
  --text:rgb(var(--slate-12)); --muted:rgb(var(--slate-11)); --faint:rgb(var(--slate-10));
  --border:rgb(var(--border-container)); --border-2:rgb(var(--border-strong));
  --accent:rgb(var(--blue-9)); --accent-2:rgb(var(--blue-10));
  --brand:#2781F6;
  --sh-1:0 1px 2px rgba(0,0,0,.05),0 1px 1px rgba(0,0,0,.03);
  --sh-2:0 4px 14px rgba(0,0,0,.09),0 1px 3px rgba(0,0,0,.05);
  --sh-3:0 16px 40px rgba(0,0,0,.16),0 3px 10px rgba(0,0,0,.08);
  --r-sm:8px;--r:10px;--r-lg:14px;--r-xl:18px;
  --sp:8px;
}
[data-theme="dark"]{
  --slate-1:17 17 19;--slate-2:24 25 27;--slate-3:33 34 37;--slate-4:39 42 45;
  --slate-5:46 49 53;--slate-6:54 58 63;--slate-7:67 72 78;--slate-8:90 97 105;
  --slate-9:105 110 119;--slate-10:119 123 132;--slate-11:176 180 186;--slate-12:237 238 240;
  --iris-2:23 22 37;--iris-3:32 34 72;--iris-4:38 42 101;--iris-9:91 91 214;
  --iris-10:84 114 228;--iris-11:158 177 255;--iris-12:224 223 254;
  --blue-2:15 24 38;--blue-3:15 39 72;--blue-4:10 49 99;--blue-9:39 129 246;
  --blue-10:21 116 231;--blue-11:126 182 255;--blue-12:205 227 255;
  --ruby-3:58 20 30;--ruby-4:78 19 37;--ruby-9:229 70 102;--ruby-11:255 148 157;--ruby-12:254 210 225;
  --amber-2:29 24 15;--amber-3:48 32 8;--amber-4:63 39 0;--amber-9:255 197 61;
  --amber-11:255 202 22;--amber-12:255 231 179;
  --teal-2:17 28 27;--teal-3:13 45 42;--teal-9:18 165 148;--teal-11:11 216 182;--teal-12:173 240 221;
  --violet-2:27 21 37;--violet-3:35 28 49;--violet-9:110 86 207;--violet-11:186 160 255;--violet-12:233 221 255;
  --green-3:20 42 30;--green-9:48 164 108;--green-11:62 192 132;
  --background-color:28 29 32;--surface-1:20 21 23;--surface-2:22 23 26;
  --solid-1:23 23 26;--solid-2:29 30 36;--solid-3:44 45 54;
  --solid-blue:15 57 102;--solid-amber:56 50 41;--solid-iris:38 42 101;--solid-red:90 33 34;
  --border-container:41 42 46;--border-strong:46 45 50;--border-weak:31 31 37;
  --border:rgb(var(--slate-3));--border-2:rgb(var(--border-strong));
  --sh-1:0 1px 2px rgba(0,0,0,.45);--sh-2:0 4px 14px rgba(0,0,0,.55);--sh-3:0 16px 40px rgba(0,0,0,.7);
}

/* ══════════════════════════════════════════════════════════
   2. 基础
   ══════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-size:14px;line-height:1.5;color:var(--text);background:var(--bg);
  font-family:-apple-system,system-ui,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",
    "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
h1,h2,h3,h4,p{margin:0}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgb(var(--slate-6));border-radius:10px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgb(var(--slate-7));background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.icon{width:18px;height:18px;flex:0 0 auto;display:block;fill:none;stroke:currentColor;
  stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.icon.s{width:16px;height:16px}
.icon.xs{width:13px;height:13px}
.icon.l{width:22px;height:22px}
.icon.xl{width:28px;height:28px}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.clamp1{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}

/* ══════════════════════════════════════════════════════════
   3. 通用元件
   ══════════════════════════════════════════════════════════ */
.av{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;
  flex:0 0 auto;background:rgb(var(--slate-8));letter-spacing:.01em;user-select:none}
.av.xs{width:22px;height:22px;font-size:9.5px}
.av.s{width:28px;height:28px;font-size:11px}
.av.m{width:36px;height:36px;font-size:13px}
.av.l{width:44px;height:44px;font-size:16px}
.av.xl{width:76px;height:76px;font-size:28px}
.dot-on{position:relative}
.dot-on::after{content:"";position:absolute;right:0;bottom:0;width:11px;height:11px;border-radius:50%;
  background:rgb(var(--green-9));border:2.5px solid var(--panel)}
.dot-on.busy::after{background:rgb(var(--amber-9))}
.dot-on.offline::after{background:rgb(var(--slate-7))}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;
  border-radius:var(--r);border:1px solid var(--border-2);background:var(--panel);color:var(--text);
  font-size:13px;font-weight:560;transition:background .12s,border-color .12s,transform .06s;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn:active{transform:translateY(.5px)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent-2)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--hover);color:var(--text)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:9px}
.btn.danger{color:rgb(var(--ruby-11));border-color:rgb(var(--ruby-4))}
.btn.danger:hover{background:rgb(var(--ruby-4))}
.btn.icon{width:36px;padding:0}
.btn.icon.sm{width:30px}
.btn[disabled]{opacity:.5;pointer-events:none}
.ibtn{width:34px;height:34px;border-radius:var(--r);display:grid;place-items:center;color:var(--muted);
  border:1px solid transparent;transition:background .12s,color .12s}
.ibtn:hover{background:var(--hover);color:var(--text)}
.ibtn.on{background:rgb(var(--slate-4));color:var(--text)}

.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--accent);color:#fff;
  font-size:11px;font-weight:640;display:inline-grid;place-items:center;flex:0 0 auto}
.badge.mut{background:rgb(var(--slate-5));color:var(--muted)}
.tag{font-size:11.5px;font-weight:580;padding:3px 8px;border-radius:7px;background:rgb(var(--slate-4));
  color:var(--muted);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.tag.blue{background:rgb(var(--blue-3));color:rgb(var(--blue-11))}
.tag.amber{background:rgb(var(--amber-3));color:rgb(var(--amber-12))}
.tag.violet{background:rgb(var(--violet-3));color:rgb(var(--violet-11))}
.tag.teal{background:rgb(var(--teal-3));color:rgb(var(--teal-11))}
.tag.ruby{background:rgb(var(--ruby-4));color:rgb(var(--ruby-12))}
.tag.green{background:rgb(var(--green-3));color:rgb(var(--green-11))}
.tag.iris{background:rgb(var(--iris-4));color:rgb(var(--iris-11))}

.field{display:flex;align-items:center;gap:9px;height:38px;padding:0 12px;border:1px solid var(--border-2);
  border-radius:var(--r);background:var(--panel);transition:border-color .12s,box-shadow .12s}
.field:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgb(var(--blue-4))}
.field input,.field select{border:0;outline:none;background:none;flex:1;min-width:0}
.field .icon{color:var(--faint)}
.field.plain{background:rgb(var(--slate-3));border-color:transparent}
label.lbl{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px}
.kbd{font-size:10.5px;font-weight:600;color:var(--faint);border:1px solid var(--border-2);
  border-radius:5px;padding:1.5px 5px;background:var(--panel)}

.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh-1)}
.switch{width:38px;height:22px;border-radius:11px;background:rgb(var(--slate-6));position:relative;
  transition:background .16s;flex:0 0 auto}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;
  background:#fff;box-shadow:var(--sh-1);transition:transform .16s}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(16px)}

/* ══════════════════════════════════════════════════════════
   4. 外壳：侧边栏 + 视图区
   ══════════════════════════════════════════════════════════ */
#app{height:100vh;overflow:hidden}
.shell{display:flex;height:100vh;overflow:hidden}

/* ---------- 侧边栏 ---------- */
.sb{width:256px;flex:0 0 256px;background:var(--panel);border-right:1px solid var(--border);
  display:flex;flex-direction:column;min-height:0}
.sb-top{padding:12px 12px 8px;display:flex;flex-direction:column;gap:10px}
.acct{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r);width:100%;text-align:left}
.acct:hover{background:var(--hover)}
.acct-logo{width:26px;height:26px;border-radius:8px;flex:0 0 auto;display:grid;place-items:center;
  color:#fff;font-weight:700;font-size:12px;background:linear-gradient(135deg,#2781F6,#5B5BD6)}
.acct-nm{font-weight:640;font-size:13px;flex:1;min-width:0}
.sb-search{display:flex;align-items:center;gap:9px;height:36px;padding:0 11px;border-radius:var(--r);
  background:rgb(var(--slate-3));color:var(--muted);border:1px solid transparent}
.sb-search:hover{border-color:var(--border-2);color:var(--text)}
.sb-search span{flex:1;font-size:13px;text-align:left}
.sb-scroll{flex:1;overflow-y:auto;padding:4px 12px 16px}
.sb-grp{margin-bottom:18px}
.sb-cap{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);
  padding:0 10px 7px}
.nav{display:flex;align-items:center;gap:11px;height:38px;padding:0 10px;border-radius:var(--r);width:100%;
  text-align:left;color:var(--muted);font-size:13.5px;transition:background .1s,color .1s;position:relative}
.nav:hover{background:var(--hover);color:var(--text)}
.nav.on{background:rgb(var(--slate-4));color:var(--text);font-weight:600}
.nav.on .icon{color:var(--accent)}
.nav .icon{color:var(--faint)}
.nav .nm{flex:1;min-width:0}
.nav .chev{color:var(--faint);transition:transform .16s}
.nav.open .chev{transform:rotate(90deg)}
.tree{margin:2px 0 4px;padding-left:0;position:relative}
.tree::before{content:"";position:absolute;left:18px;top:5px;bottom:5px;border-left:1px solid var(--border-2)}
.tree .nav{height:34px;padding-left:34px;font-size:13px}
.leafttl{display:flex;align-items:center;gap:9px;height:34px;padding-left:12px;font-size:12px;
  font-weight:640;color:var(--faint);letter-spacing:.02em}
.chip-dot{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
.sb-foot{border-top:1px solid var(--border);padding:10px 12px}
.pfl{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:var(--r);width:100%;text-align:left}
.pfl:hover{background:var(--hover)}

/* ---------- 视图容器 ---------- */
.view{flex:1 1 auto;min-width:0;display:flex;overflow:hidden;background:var(--bg)}
.pane{display:flex;flex-direction:column;min-height:0;background:var(--panel)}
.pane.list{width:404px;flex:0 0 404px;border-right:1px solid var(--border)}
.pane.main{flex:1 1 auto;min-width:0}
.pane.side{width:340px;flex:0 0 340px;border-left:1px solid var(--border)}
.pane.hide{display:none}
.pane.full{flex:1 1 auto;min-width:0;flex-direction:row}
.pane-head{padding:16px 18px 12px;border-bottom:1px solid var(--border);flex:0 0 auto}
.pane-title{font-size:17px;font-weight:660;letter-spacing:-.01em}
.pane-sub{font-size:12.5px;color:var(--muted);margin-top:3px}
.pane-body{flex:1;overflow-y:auto;min-height:0}

/* ══════════════════════════════════════════════════════════
   5. 会话列表
   ══════════════════════════════════════════════════════════ */
.tabs{display:flex;gap:6px;padding:10px 18px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--border)}
.tabs::-webkit-scrollbar{display:none}
.tab{height:30px;padding:0 12px;border-radius:9px;font-size:12.5px;font-weight:560;color:var(--muted);
  border:1px solid var(--border);white-space:nowrap}
.tab:hover{background:var(--hover)}
.tab.on{background:rgb(var(--slate-4));color:var(--text);border-color:transparent}
.conv{display:flex;gap:12px;padding:14px 18px;border-bottom:1px solid var(--border);cursor:pointer;
  position:relative;text-align:left;width:100%;transition:background .1s}
.conv:hover{background:rgb(var(--slate-2))}
.conv.on{background:rgb(var(--blue-3))}
.conv.on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.conv-av{position:relative;flex:0 0 auto;align-self:flex-start}
.chan-b{position:absolute;right:-4px;bottom:-4px;width:18px;height:18px;border-radius:50%;
  display:grid;place-items:center;border:2px solid var(--panel);color:#fff}
.conv-b{flex:1;min-width:0}
.conv-r1{display:flex;align-items:baseline;gap:8px}
.conv-nm{font-weight:600;font-size:14px;flex:1;min-width:0}
.conv.read .conv-nm{font-weight:560;color:var(--muted)}
.conv-tm{font-size:11.5px;color:var(--faint);flex:0 0 auto}
.conv-r2{display:flex;align-items:center;gap:7px;margin-top:4px;font-size:12px;color:var(--faint)}
.sep{width:3px;height:3px;border-radius:50%;background:currentColor;flex:0 0 auto}
.conv-pv{font-size:13px;color:var(--muted);margin-top:5px;line-height:1.5}
.conv.unread .conv-pv{color:var(--text);font-weight:520}
.conv-tags{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap;align-items:center}
.conv-rr{position:absolute;right:18px;top:14px;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.empty{padding:56px 32px;text-align:center;color:var(--muted)}
.empty .ic{width:56px;height:56px;border-radius:16px;background:rgb(var(--slate-3));display:grid;
  place-items:center;margin:0 auto 16px;color:var(--faint)}
.empty h3{font-size:15px;font-weight:640;color:var(--text);margin-bottom:6px}
.empty p{font-size:13px;max-width:320px;margin:0 auto 18px}

/* ══════════════════════════════════════════════════════════
   6. 聊天面板
   ══════════════════════════════════════════════════════════ */
.ch-head{background:var(--panel);border-bottom:1px solid var(--border);padding:12px 18px;
  display:flex;align-items:center;gap:14px;flex:0 0 auto;min-height:68px}
.ch-who{min-width:0;flex:1}
.ch-nm{font-size:15px;font-weight:660;display:flex;align-items:center;gap:8px;min-width:0}
.ch-nm .nmx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:340px}
.ch-sub{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px;margin-top:3px;flex-wrap:wrap}
.ch-acts{display:flex;align-items:center;gap:8px}
.banner{background:rgb(var(--blue-3));color:rgb(var(--blue-12));font-size:12.5px;padding:10px 18px;
  display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--border);flex:0 0 auto}
.banner.warn{background:rgb(var(--amber-3));color:rgb(var(--amber-12))}
.banner.ok{background:rgb(var(--green-3));color:rgb(var(--green-11))}

.msgs{flex:1;overflow-y:auto;padding:24px 28px 12px;min-height:0}
.day{display:flex;align-items:center;gap:14px;margin:6px 0 22px}
.day::before,.day::after{content:"";height:1px;background:var(--border);flex:1}
.day span{font-size:11.5px;font-weight:640;color:var(--faint);letter-spacing:.05em;text-transform:uppercase}
.msg{display:flex;gap:10px;margin-bottom:14px;align-items:flex-end}
.msg.left{justify-content:flex-start}
.msg.right{justify-content:flex-end}
.msg.center{justify-content:center;margin:14px 0}
.msg-av{width:32px;flex:0 0 32px;align-self:flex-end}
.wrap{max-width:min(600px,76%);display:flex;flex-direction:column;min-width:0}
.msg.right .wrap{align-items:flex-end}
.who{font-size:12px;color:var(--muted);margin:0 4px 5px;display:flex;gap:7px;align-items:center}
.bub{border-radius:16px;padding:11px 15px;font-size:14px;line-height:1.6;box-shadow:var(--sh-1);
  word-break:break-word;white-space:pre-wrap}
.msg.left .bub{border-bottom-left-radius:5px;background:rgb(var(--slate-4))}
.msg.right .bub{border-bottom-right-radius:5px;background:rgb(var(--solid-blue))}
.bub.note{background:rgb(var(--solid-amber));border:1px dashed rgb(var(--amber-9))}
.bub.bot{background:rgb(var(--solid-iris))}
.bub.fail{background:rgb(var(--ruby-4));color:rgb(var(--ruby-12))}
.msg.center .bub{background:rgb(var(--slate-3));color:var(--muted);font-size:12.5px;border-radius:10px;
  box-shadow:none;display:inline-flex;align-items:center;gap:8px;padding:7px 13px}
.meta{font-size:11px;color:var(--faint);margin:5px 4px 0;display:flex;align-items:center;gap:6px}
.quote{border-left:3px solid var(--accent);background:rgba(0,0,0,.045);border-radius:8px;padding:7px 11px;
  margin-bottom:9px;font-size:12.5px;color:var(--muted);cursor:pointer}
[data-theme="dark"] .quote{background:rgba(255,255,255,.07)}
.quote b{display:block;font-size:12px;font-weight:640;color:var(--text);margin-bottom:2px}
.att{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;background:rgba(255,255,255,.6);
  margin-top:9px}
[data-theme="dark"] .att{background:rgba(0,0,0,.28)}
.att-ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:rgb(var(--slate-5));color:var(--muted)}
.att-t{font-size:12.5px;font-weight:580}
.att-s{font-size:11px;color:var(--faint)}
.imgph{margin-top:9px;border-radius:11px;height:150px;display:grid;place-items:center;
  background:linear-gradient(135deg,#cfe4ff,#e8f0ff 45%,#dbe7ff);color:rgb(var(--blue-11));
  border:1px solid rgba(0,0,0,.05)}
[data-theme="dark"] .imgph{background:linear-gradient(135deg,#16324f,#1d2b45 45%,#17233c)}
.callrow{display:flex;align-items:center;gap:13px;min-width:260px}
.call-ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.55);
  color:rgb(var(--green-11));flex:0 0 auto}
.call-t{font-weight:620;font-size:13px}
.call-s{font-size:11.5px;color:var(--muted);margin-top:1px}
.wave{display:flex;align-items:center;gap:2.5px;height:22px;color:rgb(var(--green-9))}
.wave i{width:3px;border-radius:2px;background:currentColor;opacity:.55}
.mention{color:rgb(var(--iris-11));background:rgb(var(--iris-4));border-radius:4px;padding:0 4px;font-weight:580}
.typing{display:flex;gap:4px;padding:13px 16px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--faint);animation:bnc 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bnc{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-5px);opacity:1}}

.reply{background:var(--panel);border-top:1px solid var(--border);padding:10px 18px 14px;flex:0 0 auto}
.reply-tabs{display:flex;align-items:center;gap:5px;margin-bottom:9px}
.rtab{font-size:12.5px;font-weight:580;color:var(--muted);height:30px;padding:0 12px;border-radius:9px;
  display:inline-flex;align-items:center;gap:7px}
.rtab:hover{background:var(--hover)}
.rtab.on{background:rgb(var(--slate-4));color:var(--text)}
.rtab.on.note{background:rgb(var(--amber-3));color:rgb(var(--amber-12))}
.editor{border:1px solid var(--border-2);border-radius:var(--r-lg);background:var(--panel);overflow:hidden;
  transition:border-color .12s,box-shadow .12s}
.editor:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgb(var(--blue-4))}
.editor.note{background:rgb(var(--amber-2))}
.editor.note:focus-within{border-color:rgb(var(--amber-9));box-shadow:0 0 0 3px rgb(var(--amber-3))}
.editor textarea{width:100%;border:0;outline:none;resize:none;background:none;padding:13px 15px;
  min-height:52px;max-height:220px;line-height:1.6;font-size:14px;display:block}
.editor textarea::placeholder{color:var(--faint)}
.tools{display:flex;align-items:center;gap:3px;padding:7px 10px;border-top:1px solid var(--border)}
.editor.note .tools{border-top-color:rgb(var(--amber-9))}
.tool{height:32px;min-width:32px;padding:0 8px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.tool:hover{background:var(--hover);color:var(--text)}
.grow{flex:1}

/* ══════════════════════════════════════════════════════════
   7. 联系人面板
   ══════════════════════════════════════════════════════════ */
.ct-head{padding:26px 20px 18px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;
  align-items:center;gap:10px;flex:0 0 auto}
.ct-nm{font-size:17px;font-weight:660}
.ct-sub{font-size:12.5px;color:var(--muted)}
.ct-acts{display:flex;gap:8px;width:100%;margin-top:6px}
.ct-acts .btn{flex:1;padding:0 8px}
.ct-tabs{display:flex;padding:0 14px;border-bottom:1px solid var(--border);flex:0 0 auto}
.ct-tab{flex:1;text-align:center;font-size:13px;font-weight:580;color:var(--muted);padding:12px 4px;
  border-bottom:2px solid transparent}
.ct-tab:hover{color:var(--text)}
.ct-tab.on{color:var(--text);border-bottom-color:var(--accent)}
.ct-body{flex:1;overflow-y:auto;padding:18px 20px 32px}
.sec{margin-bottom:24px}
.sec-h{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);
  display:flex;align-items:center;gap:8px;margin-bottom:12px}
.kv{display:flex;gap:12px;padding:7px 0;font-size:13px;align-items:flex-start}
.kv .icon{color:var(--faint);margin-top:2px}
.kv-k{color:var(--muted);width:92px;flex:0 0 92px}
.kv-v{flex:1;min-width:0;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.prev{display:flex;gap:11px;padding:11px;border:1px solid var(--border);border-radius:var(--r);
  margin-bottom:9px;width:100%;text-align:left;align-items:center}
.prev:hover{background:var(--hover)}
.prev .ttl,.prev .sub{display:block}

/* ══════════════════════════════════════════════════════════
   8. 内容页（联系人 / 报表 / 设置 / 门户 / Captain / 通话）
   ══════════════════════════════════════════════════════════ */
.page{flex:1;overflow-y:auto;min-height:0}
.page-in{max-width:1180px;margin:0 auto;padding:32px 36px 64px}
.page-hd{display:flex;align-items:flex-start;gap:16px;margin-bottom:26px;flex-wrap:wrap}
.page-hd h1{font-size:24px;font-weight:680;letter-spacing:-.02em}
.page-hd p{font-size:13.5px;color:var(--muted);margin-top:6px;max-width:640px}
.page-hd .btn{margin-left:auto}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.stat{padding:20px 22px}
.stat .k{font-size:12.5px;color:var(--muted);font-weight:560}
.stat .v{font-size:28px;font-weight:700;letter-spacing:-.03em;margin-top:8px;display:flex;align-items:baseline;gap:8px}
.stat .d{font-size:12px;font-weight:600;color:rgb(var(--green-11))}
.stat .d.dn{color:rgb(var(--ruby-11))}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--faint);padding:12px 16px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:14px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:var(--hover)}
.tbl .nm{font-weight:580}
.rowa{display:flex;align-items:center;gap:12px}
.bar{height:8px;border-radius:4px;background:rgb(var(--slate-4));overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:-1px}
.set-list{display:flex;flex-direction:column}
.set-row{display:flex;align-items:center;gap:16px;padding:16px 20px;border-bottom:1px solid var(--border);
  width:100%;text-align:left}
.set-row:last-child{border-bottom:0}
.set-row:hover{background:var(--hover)}
.set-row .ttl{font-size:14px;font-weight:580;display:block}
.set-row .sub{font-size:12.5px;color:var(--muted);margin-top:3px;display:block}
.set-nav{width:236px;flex:0 0 236px;background:var(--panel);border-right:1px solid var(--border);padding:16px 12px;overflow-y:auto}
.set-nav .nav{height:36px;font-size:13.5px}
.tile{padding:20px;display:flex;flex-direction:column;gap:6px;text-align:left;width:100%}
.tile:hover{background:var(--hover)}
.tile .ico{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;margin-bottom:10px}
.tile .t{font-size:14px;font-weight:620;display:block}
.tile .d{font-size:12.5px;color:var(--muted);line-height:1.5;display:block}

/* ---------- 登录 ---------- */
.login{display:flex;height:100vh}
.login-brand{width:46%;flex:0 0 46%;background:linear-gradient(150deg,#1B3A6B,#2781F6 55%,#5B5BD6);
  color:#fff;padding:56px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.login-brand::after{content:"";position:absolute;right:-140px;bottom:-160px;width:420px;height:420px;
  border-radius:50%;background:rgba(255,255,255,.09)}
.login-mark{display:flex;align-items:center;gap:11px;font-weight:700;font-size:17px}
.login-h1{font-size:40px;font-weight:720;line-height:1.18;letter-spacing:-.03em;margin-top:auto}
.login-h1 small{display:block;font-size:16px;font-weight:450;opacity:.85;margin-top:16px;line-height:1.6;letter-spacing:0}
.login-feats{display:flex;flex-direction:column;gap:14px;margin-top:40px;font-size:14px;opacity:.95}
.login-feats div{display:flex;align-items:center;gap:11px}
.login-form{flex:1;display:grid;place-items:center;padding:40px;background:var(--panel)}
.login-in{width:100%;max-width:384px}
.login-in h2{font-size:26px;font-weight:700;letter-spacing:-.02em}
.login-in .sub{color:var(--muted);font-size:13.5px;margin-top:8px;margin-bottom:28px}
.stack{display:flex;flex-direction:column;gap:16px}
.or{display:flex;align-items:center;gap:12px;color:var(--faint);font-size:12px;margin:4px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--border)}

/* ---------- 命令面板 / 弹窗 / Toast ---------- */
.scrim{position:fixed;inset:0;background:rgba(15,15,20,.42);backdrop-filter:blur(2px);z-index:60;
  display:flex;align-items:flex-start;justify-content:center;padding-top:12vh;animation:fade .14s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(-10px) scale(.98)}to{opacity:1;transform:none}}
.palette{width:min(620px,92vw);background:var(--panel);border:1px solid var(--border-2);border-radius:var(--r-xl);
  box-shadow:var(--sh-3);overflow:hidden;animation:pop .16s ease}
.palette .in{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--border)}
.palette .in input{border:0;outline:none;background:none;flex:1;font-size:15px}
.pal-list{max-height:min(52vh,420px);overflow-y:auto;padding:8px}
.pal-grp{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);
  padding:10px 12px 6px}
.pal-it{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:var(--r);width:100%;text-align:left}
.pal-it:hover,.pal-it.sel{background:var(--hover)}
.pal-it.sel{background:rgb(var(--blue-3))}
.pal-it .t{flex:1;min-width:0;font-size:13.5px}
.pal-it .d{font-size:12px;color:var(--faint)}
.modal{width:min(540px,92vw);background:var(--panel);border:1px solid var(--border-2);border-radius:var(--r-xl);
  box-shadow:var(--sh-3);animation:pop .16s ease;overflow:hidden}
.modal.wide{width:min(720px,94vw)}
.modal-hd{padding:20px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.modal-hd h3{font-size:16px;font-weight:660;flex:1}
.modal-bd{padding:22px;max-height:64vh;overflow-y:auto}
.modal-ft{padding:16px 22px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end}
.menu{position:absolute;z-index:70;background:var(--panel);border:1px solid var(--border-2);border-radius:var(--r-lg);
  box-shadow:var(--sh-3);padding:6px;min-width:210px;animation:pop .12s ease}
.menu-it{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:8px;width:100%;
  text-align:left;font-size:13.5px}
.menu-it:hover{background:var(--hover)}
.menu-it.danger{color:rgb(var(--ruby-11))}
.menu-sep{height:1px;background:var(--border);margin:5px 6px}
.toasts{position:fixed;right:20px;bottom:20px;z-index:90;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.toast{background:var(--panel);border:1px solid var(--border-2);border-radius:var(--r-lg);box-shadow:var(--sh-3);
  padding:13px 16px;display:flex;align-items:center;gap:11px;font-size:13.5px;animation:pop .18s ease;
  max-width:380px}
.toast .ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto}
.toast.ok .ic{background:rgb(var(--green-3));color:rgb(var(--green-11))}
.toast.info .ic{background:rgb(var(--blue-3));color:rgb(var(--blue-11))}

/* ══════════════════════════════════════════════════════════
   9. 客服挂件（Widget）—— 客户侧
   ══════════════════════════════════════════════════════════ */
:root{--wgc:#1F93FF}
.site{min-height:100vh;background:#fff;color:#0f172a}
.site-nav{display:flex;align-items:center;gap:28px;padding:18px 40px;border-bottom:1px solid #eef0f3;
  position:sticky;top:0;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);z-index:5}
.site-logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
.site-logo .m{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#111827,#374151);display:grid;place-items:center;color:#fff;font-size:12px}
.site-nav a{font-size:13.5px;color:#6b7280;font-weight:520}
.site-nav a:hover{color:#0f172a}
.site-cart{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13.5px;color:#6b7280}
.site-hero{padding:72px 40px 56px;max-width:1080px;margin:0 auto;display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:center}
.site-hero h1{font-size:44px;line-height:1.1;letter-spacing:-.03em;font-weight:720;margin-bottom:18px}
.site-hero p{font-size:16px;color:#6b7280;line-height:1.65;max-width:460px;margin-bottom:26px}
.site-cta{display:inline-flex;align-items:center;gap:9px;height:46px;padding:0 22px;border-radius:999px;
  background:#0f172a;color:#fff;font-weight:600;font-size:14.5px}
.site-visual{border-radius:22px;height:330px;background:linear-gradient(135deg,#e0f2fe,#ede9fe 50%,#fce7f3);
  display:grid;place-items:center;color:#94a3b8;border:1px solid #eef0f3}
.site-sec{max-width:1080px;margin:0 auto;padding:0 40px 72px}
.site-sec h2{font-size:22px;font-weight:680;letter-spacing:-.02em;margin-bottom:18px}
.site-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.site-card{border:1px solid #eef0f3;border-radius:16px;overflow:hidden}
.site-card .ph{height:150px;background:linear-gradient(135deg,#f1f5f9,#e2e8f0);display:grid;place-items:center;color:#94a3b8}
.site-card .bd{padding:14px 16px}
.site-card .t{font-weight:600;font-size:14px}
.site-card .d{font-size:13px;color:#6b7280;margin-top:3px}
.site-card .p{margin-top:10px;font-weight:640}
.wg-launcher{position:fixed;right:26px;bottom:26px;width:62px;height:62px;border-radius:50%;background:var(--wgc);
  display:grid;place-items:center;color:#fff;border:0;cursor:pointer;z-index:55;
  box-shadow:0 10px 34px rgba(31,147,255,.42);transition:transform .16s ease}
.wg-launcher:hover{transform:scale(1.07)}
.wg-launcher .icon{width:26px;height:26px;stroke-width:2}
.wg-badge{position:absolute;top:-3px;right:-3px;min-width:22px;height:22px;border-radius:11px;background:#E54666;color:#fff;
  font-size:11.5px;font-weight:700;display:grid;place-items:center;border:2.5px solid #fff}
.wg-panel{position:fixed;right:26px;bottom:102px;width:400px;height:min(620px,calc(100vh - 150px));background:#fff;
  border-radius:18px;box-shadow:0 30px 80px rgba(15,23,42,.3);display:flex;flex-direction:column;overflow:hidden;
  z-index:55;color:#0f172a;animation:pop .18s ease}
.wg-head{background:var(--wgc);color:#fff;padding:16px 18px;display:flex;align-items:center;gap:12px;flex:0 0 auto}
.wg-head .t{font-weight:660;font-size:15px}
.wg-head .s{font-size:12.5px;opacity:.9;display:flex;align-items:center;gap:6px;margin-top:2px}
.wg-body{flex:1;overflow-y:auto;padding:20px;background:#fff;min-height:0}
.wg-foot{border-top:1px solid #eef0f3;padding:10px 12px;display:flex;gap:8px;align-items:flex-end;flex:0 0 auto}
.wg-foot textarea{flex:1;border:1px solid #e2e8f0;border-radius:12px;padding:10px 12px;outline:none;resize:none;
  min-height:42px;max-height:110px;font-size:14px;line-height:1.5;font-family:inherit}
.wg-foot textarea:focus{border-color:var(--wgc)}
.wg-send{width:42px;height:42px;border-radius:50%;background:var(--wgc);color:#fff;display:grid;place-items:center;flex:0 0 auto}
.wg-in{display:flex;gap:9px;margin-bottom:14px;align-items:flex-end}
.wg-in.me{flex-direction:row-reverse}
.wg-bub{padding:11px 14px;border-radius:16px;font-size:14px;line-height:1.55;max-width:78%;white-space:pre-wrap;
  word-break:break-word}
.wg-in.them .wg-bub{background:#f1f5f9;border-bottom-left-radius:5px}
.wg-in.me .wg-bub{background:var(--wgc);color:#fff;border-bottom-right-radius:5px}
.wg-av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11.5px;font-weight:640;flex:0 0 30px}
.wg-tm{font-size:10.5px;color:#9aa3af;margin:5px 4px 0}
.wg-feat{display:flex;align-items:center;gap:11px;padding:13px 14px;border:1px solid #eef0f3;border-radius:12px;
  margin-bottom:9px;width:100%;text-align:left;font-size:13.5px}
.wg-feat:hover{background:#f8fafc;border-color:#e2e8f0}
.wg-btn{width:100%;height:46px;border-radius:999px;background:var(--wgc);color:#fff;font-weight:640;font-size:14.5px;
  display:grid;place-items:center;margin-top:14px}
.wg-avs{display:flex;margin-bottom:14px}
.wg-avs .av{border:2.5px solid #fff;margin-left:-10px}
.wg-avs .av:first-child{margin-left:0}
.wg-fl{display:block;font-size:12.5px;font-weight:600;color:#475569;margin:14px 0 6px}
.wg-fi{width:100%;height:44px;border:1px solid #e2e8f0;border-radius:11px;padding:0 13px;outline:none;font-size:14px}
.wg-fi:focus{border-color:var(--wgc)}
.stars{display:flex;gap:8px;justify-content:center;margin:8px 0 4px}
.star{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:24px;border:1px solid #e2e8f0;background:#fff}
.star.on{background:#FFF7E0;border-color:#FFC53D}

/* ══════════════════════════════════════════════════════════
   10. VoIP —— 通话弹卡 / 悬浮通话窗 / 通话详情
   ══════════════════════════════════════════════════════════ */
.callcard{width:346px;border-radius:18px;padding:14px 0 8px;color:rgb(237 238 240);
  background:#212226;outline:1px solid rgba(255,255,255,.12);
  box-shadow:0 22px 60px rgba(0,0,0,.5);animation:pop .2s ease}
[data-theme="dark"] .callcard{background:#32353D}
.callcard.in-progress{padding-bottom:10px}
.cc-top{display:flex;align-items:center;gap:8px;padding:0 16px 12px;border-bottom:1px solid rgba(255,255,255,.1)}
.cc-st{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:#12A594;letter-spacing:-.01em}
.cc-loc{font-size:12px;color:rgb(173 177 184);flex:1;min-width:0}
.cc-dur{font-size:16px;font-weight:600;color:rgb(173 177 184);font-variant-numeric:tabular-nums}
.cc-main{display:flex;align-items:center;gap:12px;padding:12px 16px}
.cc-nm{font-size:14px;font-weight:600;letter-spacing:-.01em;line-height:1.25}
.cc-ph{font-size:13.5px;color:rgb(173 177 184);line-height:1.3;margin-top:2px}
.cc-acts{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.cc-r{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto}
.cc-r.teal{background:#12A594;color:#fff}
.cc-r.ruby{background:#E54666;color:#fff}
.cc-r.amber{background:#FFC53D;color:#3F2700}
.cc-r.slate{background:rgba(255,255,255,.12);color:rgb(237 238 240)}
.cc-r .icon{width:17px;height:17px}
.cc-hang{transform:rotate(135deg)}
.cc-hang .icon{transform:rotate(-135deg)}
.cc-go{display:flex;align-items:center;gap:8px;padding:9px 16px;margin:0 8px 2px;border-radius:10px;
  font-size:13.5px;color:rgb(173 177 184);width:calc(100% - 16px)}
.cc-go:hover{background:rgba(255,255,255,.07);color:rgb(237 238 240)}
.cc-tx{margin:0 16px 10px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.07);max-height:150px;overflow-y:auto}
.cc-tx .l{font-size:12.5px;line-height:1.5;margin-bottom:7px;display:flex;gap:8px}
.cc-tx .l:last-child{margin-bottom:0}
.cc-tx .w{color:#12A594;font-weight:600;flex:0 0 42px;font-size:11.5px;padding-top:1px}
.cc-tx .w.c{color:#FFC53D}
.cc-tx .m{flex:1;color:rgb(237 238 240)}
@keyframes ringpulse{0%{box-shadow:0 0 0 0 rgba(18,165,148,.55)}100%{box-shadow:0 0 0 26px rgba(18,165,148,0)}}
.ringing{animation:ringpulse 1.6s ease-out infinite}
.callstack{position:fixed;right:24px;bottom:24px;z-index:80;display:flex;flex-direction:column;gap:12px;align-items:flex-end}
.callstack.ring{right:auto;left:50%;top:104px;bottom:auto;transform:translateX(-50%);align-items:center}
.rec-dot{width:7px;height:7px;border-radius:50%;background:#E54666;animation:blink 1.4s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

/* 通话详情 */
.tx-row{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--border)}
.tx-w{flex:0 0 96px;font-size:12.5px;font-weight:640;color:var(--muted);display:flex;align-items:center;gap:7px}
.tx-m{flex:1;font-size:13.5px;line-height:1.6}
.tx-t{font-size:11px;color:var(--faint);flex:0 0 44px;text-align:right;padding-top:3px}
.wavebig{display:flex;align-items:center;gap:2px;height:64px}
.wavebig i{flex:1;border-radius:2px;background:rgb(var(--blue-9));opacity:.75;min-width:2px}
.rec-row{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--panel)}

/* ---------- 规则 / 宏 编辑器 ---------- */
.rule-sec{border:1px solid var(--border);border-radius:var(--r-lg);padding:16px 18px;margin-bottom:16px;background:var(--panel)}
.rule-sec-h{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:640;margin-bottom:8px}
.rule-sec-h .icon{color:var(--muted)}
.rule-row{display:flex;align-items:center;gap:10px;padding:9px 0;flex-wrap:wrap;border-bottom:1px dashed var(--border)}
.rule-row:last-of-type{border-bottom:0}
.rule-num{width:22px;height:22px;border-radius:7px;background:rgb(var(--slate-4));color:var(--muted);
  font-size:11.5px;font-weight:640;display:grid;place-items:center;flex:0 0 auto}
.rule-params{flex:1;min-width:180px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.rule-chip{font-size:11.5px;font-weight:580;padding:3px 8px;border-radius:7px;background:rgb(var(--slate-4));color:var(--muted);white-space:nowrap}
.rule-chip.and{background:rgb(var(--blue-3));color:rgb(var(--blue-11))}
select.field{appearance:none;padding-inline-end:26px;background-image:linear-gradient(45deg,transparent 50%,rgb(var(--slate-11)) 50%),linear-gradient(135deg,rgb(var(--slate-11)) 50%,transparent 50%);
  background-position:calc(100% - 15px) 15px,calc(100% - 10px) 15px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;cursor:pointer}
textarea.field{align-items:flex-start;padding:8px 10px;line-height:1.5;resize:vertical;font-family:inherit}

.bulkbar{display:flex;align-items:center;gap:5px;padding:9px 12px;border-bottom:1px solid var(--border);background:var(--panel-2);flex:0 0 auto}
.cbx{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--border-2);display:grid;place-items:center;
  flex:0 0 auto;align-self:center;color:#fff}
.cbx.on{background:var(--accent);border-color:var(--accent)}

/* ---------- 通知中心 / 快捷键 ---------- */
.notif-pop{position:fixed;left:236px;top:60px;width:372px;background:var(--panel);border:1px solid var(--border-2);
  border-radius:var(--r-lg);box-shadow:var(--sh-3);overflow:hidden;z-index:70;animation:pop .14s ease}
.notif-hd{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);font-size:13.5px;font-weight:640}
.notif-list{max-height:420px;overflow-y:auto}
.notif-it{display:flex;gap:11px;padding:12px 14px;width:100%;text-align:left;border-bottom:1px solid var(--border);align-items:flex-start}
.notif-it:hover{background:var(--hover)}
.notif-it.unread{background:rgb(var(--blue-2))}
.n-ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:0 0 auto;background:rgb(var(--slate-4));color:var(--muted)}
.n-tx{display:block;font-size:13px;line-height:1.45}
.n-tm{display:block;font-size:11.5px;color:var(--faint);margin-top:3px}
.n-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:0 0 auto;margin-top:6px}
.sc-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px 26px}
.sc-row{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.sc-row .kbd{min-width:40px;text-align:center;color:var(--text);font-weight:600}

/* ---------- 权限矩阵 / 筛选构建器 / 合并 ---------- */
.matrix{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.matrix th{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);
  padding:10px 12px;text-align:center;border-bottom:1px solid var(--border);white-space:nowrap}
.matrix th:first-child,.matrix td:first-child{text-align:left}
.matrix td{padding:9px 12px;border-bottom:1px solid var(--border);text-align:center}
.matrix tr:last-child td{border-bottom:0}
.matrix .res{font-weight:580}
.matrix tbody tr:hover{background:var(--hover)}
.chk{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--border-2);display:inline-grid;place-items:center;color:#fff}
.chk.on{background:var(--accent);border-color:var(--accent)}
.chk.on.locked{background:rgb(var(--slate-7));border-color:rgb(var(--slate-7))}
.fb-row{display:flex;align-items:center;gap:9px;padding:8px 0;flex-wrap:wrap;border-bottom:1px dashed var(--border)}
.fb-row:last-of-type{border-bottom:0}
.merge-col{border:1px solid var(--border);border-radius:var(--r-lg);padding:14px;flex:1;min-width:0}
.merge-col.on{border-color:var(--accent);box-shadow:0 0 0 3px rgb(var(--blue-3))}
.merge-field{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:13px;text-align:left;width:100%}
.merge-field .k{width:84px;flex:0 0 84px;color:var(--muted);font-size:12.5px}
.merge-field .v{flex:1;min-width:0;overflow-wrap:anywhere}

/* ---------- 密度调节 ---------- */
[data-density="compact"] .conv{padding:10px 18px}
[data-density="compact"] .bub{padding:9px 13px;font-size:13.5px}
[data-density="compact"] .set-row{padding:12px 20px}
[data-density="compact"] .msgs{padding:16px 22px 8px}

/* ---------- 响应式 ---------- */
@media(max-width:1500px){.pane.side{display:none}.pane.side.force{display:flex;position:absolute;right:0;top:0;bottom:0;z-index:30;box-shadow:var(--sh-3)}}
@media(max-width:1200px){.sb{width:74px;flex:0 0 74px}.sb .acct-nm,.sb .nm,.sb .chev,.sb-cap,.sb-search span,.sb-search .kbd,.sb-foot .nm2{display:none}.nav{justify-content:center;padding:0}.tree::before{display:none}.tree .nav{padding-left:0}}
@media(max-width:980px){.pane.list{width:320px;flex:0 0 320px}}
@media(max-width:760px){.pane.list{display:none}}

/* 把一个 action 真的作用到会话上 */
function applyAction(c, a) {
  const p = a.p || {};
  switch (a.type) {
    case 'assign_agent':
      c.assignee = p.agent || null;
      if (c.assignee) logActivity(c, `${contact(c.contact).name} 已分配给 ${agent(c.assignee).name}`);
      break;
    case 'assign_team':
      c.team = p.team || null;
      if (c.team) logActivity(c, `已加入 ${team(c.team).name} 组`);
      break;
    case 'add_label':
      (p.labels || []).forEach(l => { if (!c.labels.includes(l)) c.labels.push(l); });
      if ((p.labels || []).length) logActivity(c, `已打标签：${p.labels.join('、')}`);
      break;
    case 'remove_label':
      c.labels = c.labels.filter(l => !(p.labels || []).includes(l));
      break;
    case 'send_message':
      if (p.text) pushMsg(c, { t: 'out', text: p.text, ts: nowTs(), status: 'sent', by: DB.me.id });
      break;
    case 'send_private_note':
      if (p.text) pushMsg(c, { t: 'note', text: p.text, ts: nowTs(), by: DB.me.id });
      break;
    case 'change_priority':
      c.priority = p.priority || 'medium';
      logActivity(c, `优先级改为 ${PRIORITY[c.priority].label}`);
      break;
    case 'resolve_conversation':
      c.status = 'resolved'; logActivity(c, '会话已标记为已解决'); break;
    case 'snooze_conversation':
      snoozeConv(c, p.until || '4 小时后'); break;
    case 'mute_conversation':
      c.muted = true; logActivity(c, '会话已静音'); break;
    case 'send_webhook_event':
      logActivity(c, `Webhook 已发送：${p.url || 'https://…'}`); break;
    case 'send_email_transcript':
      logActivity(c, `邮件转写已发送给 ${p.emails || '客服邮箱'}`); break;
  }
}
function applyMacro(c, m) {
  (m.actions || []).forEach(a => applyAction(c, a));
  toast(`已应用宏：${m.name}`);
}
/* 催办：状态转 snoozed + 记 reopened 时间 */
function snoozeConv(c, until) {
  c.status = 'snoozed';
  c.snoozeUntil = until;
  logActivity(c, `会话已催办（${until}）`);
}
function unsnooze(c) {
  c.status = 'open'; c.snoozeUntil = null;
  logActivity(c, '会话已取消催办');
}
/* 演示：对一条会话跑一遍匹配的自动化规则 */
function runAutomations(c, event) {
  const hits = DB.automations.filter(r => r.active && r.event === event);
  hits.forEach(r => (r.actions || []).forEach(a => applyAction(c, a)));
  if (hits.length) toast(`${hits.length} 条自动化规则命中：${hits.map(r => r.name).join('、')}`, 'info');
  return hits.length;
}

  const vals = f.values || [];
  const actual = filterValue(f, c);
  const op = f.op;
  if (op === 'is_present') {
    if (f.attr === 'assignee') return !!c.assignee;
    if (f.attr === 'unread') return unreadOf(c) > 0;
    return Array.isArray(actual) ? actual.length > 0 : (actual != null && String(actual).length > 0);
  }
  if (op === 'is_not_present') {
    if (f.attr === 'assignee') return !c.assignee;
    if (f.attr === 'unread') return unreadOf(c) === 0;
    return Array.isArray(actual) ? actual.length === 0 : (actual == null || String(actual).length === 0);
  }
  const arr = (Array.isArray(actual) ? actual : [actual]).map(a => a == null ? '' : String(a));
  const hit = v => arr.some(a => a.toLowerCase() === String(v).toLowerCase());
  switch (op) {
    case 'equal_to':     return vals.some(hit);
    case 'not_equal_to': return !vals.some(hit);
    case 'contains':     return vals.some(v => arr.some(a => a.toLowerCase().includes(String(v).toLowerCase())));
    case 'start_with':   return vals.some(v => arr.some(a => a.toLowerCase().startsWith(String(v).toLowerCase())));
  }
  return false;
}
const matchesFilters = (c, filters, op = 'and') =>
  !(filters || []).length ? true
    : (op === 'or' ? filters.some(f => convMatchesFilter(c, f)) : filters.every(f => convMatchesFilter(c, f)));
const newFilter = () => ({ attr: 'status', op: 'equal_to', values: [] });

/* 角色权限矩阵：初始化 perms */
const PERM_RESOURCES = [['conversation','会话'],['contact','联系人'],['report','报表'],['knowledge','知识库'],['settings','设置'],['billing','计费']];
const PERM_ACTIONS = [['read','查看'],['write','创建/编辑'],['delete','删除'],['manage','管理']];
(function initRolePerms() {
  const overrides = {
    r2: ['contact.delete','conversation.delete','conversation.manage',
         'report.write','report.delete','report.manage',
         'knowledge.write','knowledge.delete','knowledge.manage',
         'settings.read','settings.write','settings.delete','settings.manage',
         'billing.read','billing.write','billing.delete','billing.manage'],
    r3: ['settings.write','settings.delete','settings.manage','billing.write','billing.delete','billing.manage'],
  };
  DB.roles.forEach(r => {
    r.perms = r.perms || {};
    PERM_RESOURCES.forEach(([res]) => PERM_ACTIONS.forEach(([act]) => {
      const key = res + '.' + act;
      let v;
      if (r.id === 'r1') v = true;
      else if (r.id === 'r4') v = (act === 'read');
      else v = !(overrides[r.id] || []).includes(key);
      if (r.perms[key] === undefined) r.perms[key] = v;
    }));
  });
})();
const rolePermCount = r => Object.values(r.perms || {}).filter(Boolean).length;

/* ---------- 会话列表 ---------- */
function filteredConvs() {
  const q = UI.convSearch.trim().toLowerCase();
  // hash 上的 ?f= / ?inbox= 过滤
  const qs = route().path.split('?')[1] || '';
  const p = new URLSearchParams(qs);
  const f = p.get('f') || UI.convFilter;
  const inboxId = p.get('inbox');
  const folder = p.get('folder') ? byId(DB.folders, p.get('folder')) : null;
  let list = DB.conversations.slice();
  if (f === 'unassigned') list = list.filter(c => !c.assignee);
  if (f === 'mentions')   list = list.filter(c => c.labels.includes('VIP'));
  if (f === 'mine')       list = list.filter(c => c.assignee === DB.me.id);
  if (f === 'unattended') list = list.filter(c => c.status === 'open' && !c.assignee);
  if (f === 'snoozed')    list = list.filter(c => c.status === 'snoozed');
  if (f === 'pending')    list = list.filter(c => c.status === 'pending');
  if (f === 'resolved')   list = list.filter(c => c.status === 'resolved');
  if (inboxId)            list = list.filter(c => c.inbox === inboxId);
  if (folder)             list = list.filter(c => matchesFilters(c, folder.filters, folder.op));
  if (p.get('adhoc') && UI.adhoc) list = list.filter(c => matchesFilters(c, UI.adhoc.filters, UI.adhoc.op));
  if (q) list = list.filter(c =>
    contact(c.contact).name.toLowerCase().includes(q) ||
    c.messages.some(m => (m.text || '').toLowerCase().includes(q)));
  return list.sort((a, b) => (b.pinned?1:0) - (a.pinned?1:0));
}

/* data-sync：把表单值写回 UI.rule / UI.macro / UI（cannedForm） */
function setPath(obj, path, value) {
  const parts = path.split('.');
  let cur = obj;
  for (let i = 0; i < parts.length - 1; i++) {
    const k = parts[i];
    if (cur[k] == null) cur[k] = /^\d+$/.test(parts[i + 1]) ? [] : {};
    cur = cur[k];
  }
  const last = parts[parts.length - 1];
  if (/^\d+$/.test(last)) cur[+last] = value; else cur[last] = value;
}
function syncRoot(path) {
  if (path.startsWith('cannedForm')) return UI;
  if (UI.filterDraft) return UI.filterDraft;
  if (UI.rule) return UI.rule;
  if (UI.macro) return UI.macro;
  return null;
}

/* ---------- 报表 ---------- */
function lineChart(vals, labels, color = '39 129 246') {
  const w = 720, h = 190, pad = { l: 6, r: 6, t: 14, b: 24 };
  const max = Math.max(...vals) * 1.15;
  const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
  const pts = vals.map((v, i) => [pad.l + i * iw / (vals.length - 1), pad.t + ih - v / max * ih]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const gid = 'gr' + color.replace(/\s/g, '');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" style="stop-color:rgb(${color});stop-opacity:.3"/>
      <stop offset="100%" style="stop-color:rgb(${color});stop-opacity:0"/></linearGradient></defs>
    ${[0,.25,.5,.75,1].map(f => `<line x1="${pad.l}" x2="${pad.l+iw}" y1="${pad.t+f*ih}" y2="${pad.t+f*ih}" style="stroke:var(--border)" stroke-width="1"/>`).join('')}
    <path d="${d} L${pad.l+iw} ${pad.t+ih} L${pad.l} ${pad.t+ih} Z" fill="url(#${gid})"/>
    <path d="${d}" fill="none" style="stroke:rgb(${color})" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" style="fill:var(--panel);stroke:rgb(${color})" stroke-width="2"><title>${labels[i]}: ${vals[i]}</title></circle>`).join('')}
    ${labels.map((l, i) => i % 2 === 0 ? `<text x="${pts[i][0]}" y="${h-5}" font-size="10" text-anchor="middle" style="fill:rgb(var(--slate-10))">${l}</text>` : '').join('')}
  </svg>`;
}

  else if (t === 'canned')      { body = CannedView(); }
  else if (t === 'sla')         { body = SlaView(); }
  else if (t === 'assignment')  { body = AssignmentView(); }
  else if (t === 'roles')       { body = RolesView(); }
  else if (t === 'notifications') { body = NotificationPrefsView(); }
  else if (isInboxDetail)       { body = InboxDetail(t.replace('inbox-', '')); }
  else                          { body = content[t] || content.inboxes; }

  return `<section class="pane full">
    <div class="set-nav">
      ${groups.map(([g, items]) => `<div class="sb-grp">

  </section>`;
}

function settingRow(title, desc, on) {
  return `<div style="display:flex;align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid var(--border)">
    <span style="flex:1"><span style="display:block;font-size:13.5px;font-weight:580">${title}</span>
    <span style="display:block;font-size:12.5px;color:var(--muted);margin-top:2px">${desc}</span></span>
    <span class="switch${on?' on':''}" data-act="toggle-fake"></span></div>`;
}

function InboxDetail(id) {
  const i = inbox(id); if (!i) return '<p>Not found</p>';
  const convs = DB.conversations.filter(c => c.inbox === i.id);
  return `
    <div class="page-hd" style="margin-bottom:20px">
      <button class="ibtn" data-act="settings-tab" data-v="inboxes">${ic('i-back','s')}</button>
      ${av({ initials: '', color: i.color }, 'l')}
      <div style="flex:1"><h1 style="font-size:20px;display:flex;align-items:center;gap:10px">
        <span style="color:${i.color}">${ic(CHAN[i.type].icon,'l')}</span>${esc(i.name)}</h1>
        <p>${esc(i.detail)}</p></div>
      <button class="btn" data-act="toast" data-msg="Inbox disconnected (demo)">${ic('i-out','s')} Disconnect</button>
    </div>
    <div class="grid g4" style="margin-bottom:22px">
      ${statCard('Conversations', convs.length, 'all time')}
      ${statCard('Open', convs.filter(c=>c.status==='open').length, 'right now')}
      ${statCard('Agents', i.agents.length, 'can be assigned')}
      ${statCard('Avg response', '2m 12s', 'last 7 days')}

    <div class="grid g2">
      <div class="card" style="padding:22px">
        <div style="font-weight:620;margin-bottom:6px">Business hours</div>
        <div style="font-size:12.5px;color:var(--muted);margin-bottom:16px">Outside these hours the widget shows an away message.</div>
        <div class="card" style="background:var(--bg);padding:14px 16px;box-shadow:none">

        ${settingRow('Lock to single conversation','Reuse the same thread per contact.', false)}
        ${settingRow('Call recording','Record and transcribe voice calls.', i.type === 'website')}

function renderOverlays() {
  let html = '';
  if (UI.palette) {
    const items = paletteFiltered();
    let lastGrp = null;
    html += `<div class="scrim" data-act="palette-close"><div class="palette" data-stop>
      <div class="in">${ic('i-search')}<input id="palQuery" placeholder="Search conversations, contacts, settings…" value="${esc(UI.paletteQuery)}">
        <span class="kbd">esc</span></div>
      <div class="pal-list" id="palList">
        ${items.length ? items.map((it, idx) => {
          const grpHdr = it.grp !== lastGrp ? `<div class="pal-grp">${it.grp}</div>` : '';
          lastGrp = it.grp;
          return grpHdr + `<button class="pal-it${idx === UI.paletteSel ? ' sel' : ''}" data-act="palette-pick" data-href="${it.h}">
            ${ic(it.i,'s')}<span class="t trunc">${esc(it.t)}</span><span class="d trunc">${esc(it.d)}</span></button>`;
        }).join('') : `<div style="padding:36px;text-align:center;color:var(--muted);font-size:13px">No results for “${esc(UI.paletteQuery)}”</div>`}
      </div>
      <div style="padding:10px 16px;border-top:1px solid var(--border);display:flex;gap:16px;font-size:11.5px;color:var(--faint)">
        <span>↑↓ navigate</span><span>↵ open</span><span>esc close</span></div>
    </div></div>`;
  }
  if (UI.bell) {
    const kindIcon = k => ({ mention:'i-at', assign:'i-usercheck', sla:'i-clockalert', resolved:'i-check-circle', call:'i-phone' }[k] || 'i-bell');
    html += `<div class="notif-pop">
      <div class="notif-hd">${ic('i-bell','s')}<span style="flex:1">通知</span>
        <button class="btn sm" data-act="notif-read-all">全部已读</button></div>
      <div class="notif-list">
        ${DB.notifications.map(n => `<button class="notif-it${n.read ? '' : ' unread'}" data-act="notif-open" data-id="${n.id}">
          <span class="n-ic">${ic(kindIcon(n.kind),'s')}</span>
          <span style="flex:1;min-width:0"><span class="n-tx">${n.text}</span><span class="n-tm">${esc(n.ts)}</span></span>
          ${n.read ? '' : '<span class="n-dot"></span>'}
        </button>`).join('')}
      </div>
    </div>`;
  }
  if (UI.shortcuts) {
    const SC = [
      ['⌘K','命令面板 / 全局搜索'],['c','跳到会话'],['i','跳到收件箱'],['k','跳到联系人'],
      ['d','开关联系人面板'],['e','解决 / 重开会话'],['r','专注回复框'],['/','快捷回复'],
      ['?','打开快捷键面板'],['esc','关闭弹层'],['↑ ↓','在列表中移动'],['↵','打开 / 发送'],
    ];
    html += `<div class="scrim" data-act="shortcuts-close"><div class="modal" data-stop>
      <div class="modal-hd">${ic('i-sliders')}<h3>键盘快捷键</h3>
        <button class="ibtn" data-act="shortcuts-close">${ic('i-x','s')}</button></div>
      <div class="modal-bd"><div class="sc-grid">
        ${SC.map(([k, d]) => `<div class="sc-row"><span class="kbd">${k}</span><span>${d}</span></div>`).join('')}
      </div></div>
    </div></div>`;
  }
  if (UI.modal) html += modalHtml(UI.modal);
  overlays.innerHTML = html;
  if (UI.menu) {
    const m = document.createElement('div');
    m.className = 'menu';
    m.style.left = Math.min(UI.menu.x, innerWidth - 230) + 'px';
    m.style.top = Math.min(UI.menu.y, innerHeight - (UI.menu.items.length * 42 + 60)) + 'px';
    m.innerHTML = UI.menu.items.map(it => it.sep ? '<div class="menu-sep"></div>' :
      `<button class="menu-it${it.danger ? ' danger' : ''}" data-act="menu-pick" data-i="${UI.menu.items.indexOf(it)}">
        ${ic(it.i || 'i-check', 's')}<span>${esc(it.t)}</span>
        ${it.hint ? `<span style="margin-left:auto;font-size:11.5px;color:var(--faint)">${esc(it.hint)}</span>` : ''}</button>`).join('');
    overlays.appendChild(m);
  }
}

function modalHtml(m) {
  if (m.type === 'new-conv') return `<div class="scrim" data-act="close-modal"><div class="modal" data-stop>
    <div class="modal-hd">${ic('i-chatplus')}<h3>New conversation</h3>
      <button class="ibtn" data-act="close-modal">${ic('i-x','s')}</button></div>
    <div class="modal-bd">
      <div class="stack">
        <div><label class="lbl">Contact</label><div class="field">${ic('i-search','s')}
          <input placeholder="Search or create a contact…" value="${esc(m.contact || '')}"></div></div>
        <div><label class="lbl">Inbox</label><div class="field"><select>
          ${DB.inboxes.map(i => `<option>${esc(i.name)}</option>`).join('')}</select></div></div>
        <div><label class="lbl">First message</label><textarea class="field" style="height:96px;padding:12px;align-items:flex-start"
          placeholder="Write the opening message…"></textarea></div>
      </div>
    </div>
    <div class="modal-ft"><button class="btn" data-act="close-modal">Cancel</button>
      <button class="btn pri" data-act="create-conv">Create conversation</button></div>
  </div></div>`;
  if (m.type === 'canned') {
    return `<div class="scrim" data-act="close-modal"><div class="modal" data-stop>
      <div class="modal-hd">${ic('i-msg')}<h3>快捷回复</h3>
        <button class="ibtn" data-act="close-modal">${ic('i-x','s')}</button></div>
      <div class="modal-bd" style="padding:10px">
        ${DB.canned.map(x => `<button class="pal-it" data-act="use-canned" data-text="${esc(x.content)}"
          style="flex-direction:column;align-items:flex-start;gap:3px">
          <span class="t" style="font-weight:600;font-family:ui-monospace,monospace;font-size:12.5px">/${esc(x.code)}</span>
          <span class="d" style="text-align:left">${esc(x.content)}</span></button>`).join('')}
      </div>
      <div class="modal-ft" style="justify-content:flex-start">
        <button class="btn sm" data-act="close-modal" data-goto="canned">${ic('i-gear','s')} 管理快捷回复</button></div>
    </div></div>`;
  }
  if (m.type === 'filters') {
    const F = UI.filterDraft;
    const hits = DB.conversations.filter(x => matchesFilters(x, F.filters, F.op)).length;
    return `<div class="scrim" data-act="close-modal"><div class="modal wide" data-stop>
      <div class="modal-hd">${ic('i-filter')}<h3>保存视图（Folders）</h3>
        <button class="ibtn" data-act="close-modal">${ic('i-x','s')}</button></div>
      <div class="modal-bd">
        <label class="lbl">视图名称</label>
        <input class="field" data-sync="name" value="${esc(F.name)}" placeholder="例如：未分配的 VIP">
        <div style="display:flex;align-items:center;gap:8px;margin:20px 0 6px">
          <span class="lbl" style="margin:0;flex:1">筛选条件</span>
          <button class="rule-chip ${F.op === 'and' ? 'and' : ''}" data-act="filter-op" data-v="and">全部满足（AND）</button>
          <button class="rule-chip ${F.op === 'or' ? 'and' : ''}" data-act="filter-op" data-v="or">任一满足（OR）</button>
        </div>
        ${F.filters.map((f, i) => FilterRow(f, i, F.filters.length)).join('')}
        <button class="btn sm" style="margin-top:10px" data-act="filter-add">${ic('i-plus','s')} 添加条件</button>
        <div style="margin-top:20px;padding:12px 14px;border-radius:var(--r);background:rgb(var(--slate-3));font-size:12.5px">
          当前命中 <b>${hits}</b> 条会话&#10;                        ${hits ? '（' + DB.conversations.filter(x => matchesFilters(x, F.filters, F.op)).slice(0, 3).map(x => contact(x.contact).name).join('、') + '…）' : ''}
        </div>
      </div>
      <div class="modal-ft">
        ${F.id ? `<button class="btn danger" style="margin-right:auto" data-act="filter-delete">${ic('i-trash','s')} 删除视图</button>` : ''}
        <button class="btn" data-act="close-modal">取消</button>
        <button class="btn" data-act="filter-apply">仅应用</button>
        <button class="btn pri" data-act="filter-save">保存视图</button>
      </div>
    </div></div>`;
  }
  if (m.type === 'merge') {
    const M = UI.merge || {};
    if (!M.b) {
      const cur = byId(DB.contacts, M.a);
      const others = DB.contacts.filter(x => x.id !== M.a);
      return `<div class="scrim" data-act="close-modal"><div class="modal" data-stop>
        <div class="modal-hd">${ic('i-users')}<h3>合并到…</h3>
          <button class="ibtn" data-act="close-modal">${ic('i-x','s')}</button></div>
        <div class="modal-bd" style="padding:10px">
          <div style="padding:4px 12px 10px;font-size:12.5px;color:var(--muted)">
            把 <b>${esc(cur.name)}</b> 与另一个联系人合并。选中后可以逐字段选择保留哪个值。</div>
          ${others.map(x => `<button class="pal-it" data-act="merge-pick" data-id="${x.id}">
            ${av(x,'m')}<span class="t">${esc(x.name)}</span>
            <span class="d">${esc(x.email)} · ${x.convs} 会话</span></button>`).join('')}
        </div>
      </div></div>`;
    }
    const a = byId(DB.contacts, M.a), b = byId(DB.contacts, M.b);
    if (!a || !b) return '';
    const side = (x, key) => `<button class="merge-col${(M.pick[key] === key0(x) ? ' on' : '')}" data-act="merge-field" data-k="${key}" data-v="${key0(x)}">
      <div class="rowa" style="margin-bottom:10px">${av(x,'s')}<span style="font-size:13px;font-weight:620">${esc(x.name)}</span></div>
      ${MERGE_FIELDS.map(([f, l]) => `<div class="merge-field"><span class="k">${l}</span><span class="v">${esc(x[f] || '—')}</span></div>`).join('')}
      <div class="merge-field"><span class="k">会话</span><span class="v">${x.convs}</span></div>
    </button>`;
    const key0 = x => (x.id === M.a ? 'a' : 'b');
    return `<div class="scrim" data-act="close-modal"><div class="modal wide" data-stop>
      <div class="modal-hd">${ic('i-users')}<h3>合并联系人</h3>
        <button class="ibtn" data-act="close-modal">${ic('i-x','s')}</button></div>
      <div class="modal-bd">
        <div style="font-size:12.5px;color:var(--muted);margin-bottom:14px">
          保留会话更多的那一位，另一位会被删除。字段逐项选择：点击左侧或右侧列即选定该列的值。</div>
        <div class="rowa" style="align-items:stretch;gap:14px">
          ${side(a, 'a')}<span style="align-self:center;color:var(--faint);font-weight:600">+</span>${side(b, 'b')}
        </div>
        <div style="margin-top:16px;font-size:12.5px;color:var(--muted)">
          合并后：会话共 <b>${(a.convs || 0) + (b.convs || 0)}</b> 条 → 归到「${esc(a.convs >= b.convs ? a.name : b.name)}」；
          标签合并为 <b>${[...new Set([...(a.labels||[]), ...(b.labels||[])])].length}</b> 个。</div>
      </div>
      <div class="modal-ft">
        <button class="btn" data-act="close-modal">取消</button>
        <button class="btn pri" data-act="merge-run">${ic('i-users','s')} 合并</button>
      </div>
    </div></div>`;
  }
  return '';

function fmtDur(s) {
  const m = Math.floor(s / 60), r = s % 60;
  return String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0');
}
function callParty() {
  const c = UI.call.convId ? conv(UI.call.convId) : null;
  if (c) return { c, p: contact(c.contact), inb: chanOf(c) };
  const p = contact('c1');
  return { c: conv('v1'), p, inb: inbox('i2') };
}
function CallOverlay() {
  const K = UI.call;
  if (K.state === 'idle') return '';
  const { c, p, inb } = callParty();
  const isRing = K.state === 'ringing';
  const ongoing = K.state === 'active';
  const tx = LIVE_TX_DEMO;
  const liveTx = K.liveTx && ongoing ? tx.slice(0, K.txShown) : [];
  const statusLabel = isRing ? (K.dir === 'outbound' ? 'Outgoing call' : 'Incoming call')
    : K.state === 'dialing' ? 'Calling…' : 'Call in progress';
  return `<div class="callstack${isRing ? ' ring' : ''}">
    <div class="callcard${ongoing ? ' in-progress' : ''}${isRing ? ' ringing' : ''}">
      <div class="cc-top">
        <span class="cc-st">${ic(isRing && K.dir === 'inbound' ? 'i-phone' : 'i-phoneo','xs')}${statusLabel}</span>
        <span class="cc-loc">${esc(p.city)}${K.recording && ongoing ? ' · <span style="color:#E54666;display:inline-flex;align-items:center;gap:5px"><i class="rec-dot"></i>REC</span>' : ''}</span>
        ${ongoing ? `<span class="cc-dur" id="callTimer">${fmtDur(K.seconds)}</span>` : ''}
      </div>
      <div class="cc-main">
        ${av(p, 'l')}
        <span style="flex:1;min-width:0"><span class="cc-nm" style="display:block">${esc(p.name)}</span>
          <span class="cc-ph" style="display:block">${esc(p.phone)}</span></span>
        <span class="cc-acts">
          ${ongoing ? `<button class="cc-r ${K.muted ? 'amber' : 'slate'}" data-act="call-mute" title="Mute">${ic(K.muted ? 'i-mic' : 'i-mic','s')}</button>` : ''}
          ${isRing ? `<button class="cc-r teal" data-act="call-accept" title="Accept">${ic('i-phone','s')}</button>` : ''}
          <button class="cc-r ruby cc-hang" data-act="${ongoing ? 'call-end' : 'call-reject'}" title="${ongoing ? 'End call' : 'Reject'}">${ic('i-phone','s')}</button>
        </span>
      </div>
      ${ongoing && K.liveTx ? `<div class="cc-tx">
        ${liveTx.length ? liveTx.map(l => `<div class="l"><span class="w${l.w === 'contact' ? ' c' : ''}">${l.w === 'agent' ? 'Agent' : 'Contact'}</span><span class="m">${esc(l.t)}</span></div>`).join('')
          : `<div style="font-size:12px;color:rgb(173 177 184)">Listening for speech…</div>`}
      </div>` : ''}
      <button class="cc-go" data-act="call-goto-conv">${ic('i-msg','s')}
        <span style="font-variant-numeric:tabular-nums">#${esc(c.additional || c.id)}</span>${ic('i-chev-r','xs')}
        <span style="flex:1">Go to conversation</span></button>
    </div>
  </div>`;
}
/* ══════════════════════════════════════════════════════════════
   视图 5：自动化规则 / 宏 / 快捷回复 / SLA / 分配
   ══════════════════════════════════════════════════════════════ */
const sel = (path, opts, val, style = '') =>
  `<select class="field" style="height:34px;max-width:250px;${style}" data-sync="${path}">` +
  opts.map(([v, l]) => `<option value="${esc(v)}"${String(v) === String(val) ? ' selected' : ''}>${esc(l)}</option>`).join('') +
  '</select>';

function ConditionRow(c, i, total) {
  const meta = ATTRS[c.attr] || ATTRS.contact_label;
  const noVal = ['is_present', 'is_not_present'].includes(c.op);
  let values;
  if (noVal) values = '<span style="font-size:12.5px;color:var(--faint)">无需值</span>';
  else if (meta.kind === 'list') {
    values = `<span class="chips">` + meta.values().map(v => {
      const on = (c.values || []).includes(v);
      return `<button class="tag ${on ? 'blue' : ''}" data-act="rule-toggle" data-i="${i}" data-v="${esc(v)}">${meta.render ? meta.render(v) : esc(v)}</button>`;
    }).join('') + '</span>';
  } else {
    values = `<input class="field" style="height:34px;max-width:230px" data-sync="conditions.${i}.values.0"
      value="${esc((c.values || [])[0] || '')}" placeholder="输入值…">`;
  }
  return `<div class="rule-row">
    <span class="rule-num">${i + 1}</span>
    ${sel(`conditions.${i}.attr`, Object.entries(ATTRS).map(([k, v]) => [k, v.label]), c.attr)}
    ${sel(`conditions.${i}.op`, OPS[meta.kind], c.op)}
    <span class="rule-params">${values}</span>
    <button class="ibtn" data-act="rule-del-cond" data-i="${i}" ${total <= 1 ? 'disabled style="opacity:.35"' : ''}>${ic('i-trash', 's')}</button>
  </div>`;
}

function ActionRow(a, i, total) {
  const p = `actions.${i}`;
  let params = '';
  switch (a.type) {
    case 'assign_agent':
      params = sel(`${p}.p.agent`, [['', '选择坐席…'], ...DB.agents.filter(x => !x.bot).map(x => [x.id, x.name])], a.p.agent); break;
    case 'assign_team':
      params = sel(`${p}.p.team`, [['', '选择团队…'], ...DB.teams.map(t => [t.id, t.name])], a.p.team); break;
    case 'add_label':
    case 'remove_label':
      params = `<span class="chips">` + DB.labels.map(l => {
        const on = (a.p.labels || []).includes(l.name);
        return `<button class="tag ${on ? 'blue' : ''}" data-act="action-toggle-label" data-a="${i}" data-v="${esc(l.name)}">${esc(l.name)}</button>`;
      }).join('') + '</span>';
      break;
    case 'send_message':
    case 'send_private_note':
      params = `<textarea class="field" style="height:62px;max-width:460px" data-sync="${p}.p.text"
        placeholder="输入内容…（支持 {{contact.first_name}}）">${esc(a.p.text || '')}</textarea>`; break;
    case 'change_priority':
      params = sel(`${p}.p.priority`, ['low','medium','high','urgent'].map(x => [x, PRIORITY[x].label]), a.p.priority || 'medium'); break;
    case 'snooze_conversation':
      params = sel(`${p}.p.until`, [['1 小时后','1 小时后'],['4 小时后','4 小时后'],['明天 9:00','明天 9:00'],['1 周后','1 周后']], a.p.until || '4 小时后'); break;
    case 'send_webhook_event':
      params = `<input class="field" style="height:34px;max-width:400px" data-sync="${p}.p.url"
        value="${esc(a.p.url || '')}" placeholder="https://hooks.example.com/…">`; break;
    case 'send_email_transcript':
      params = `<input class="field" style="height:34px;max-width:300px" data-sync="${p}.p.emails"
        value="${esc(a.p.emails || '')}" placeholder="ops@acme.io">`; break;
    default: params = '<span style="font-size:12.5px;color:var(--faint)">无需参数</span>';
  }
  return `<div class="rule-row">
    <span class="rule-num">${i + 1}</span>
    ${sel(`${p}.type`, ACTION_TYPES, a.type)}
    <span class="rule-params">${params}</span>
    <button class="ibtn" data-act="rule-del-action" data-i="${i}" ${total <= 1 ? 'disabled style="opacity:.35"' : ''}>${ic('i-trash', 's')}</button>
  </div>`;
}

const blankRule = () => ({ id: null, name: '', desc: '', event: 'conversation_created', active: true,
  conditions: [newCondition()], actions: [newAction('add_label')] });

function syncRuleDraft(sub) {
  if (!sub) { UI.rule = null; return; }
  if (sub === 'new') { if (!UI.rule || UI.rule.id) UI.rule = blankRule(); return; }

/* 条件求值（用于「试运行」） */
function attrValue(cond, c) {
  const p = contact(c.contact);
  switch (cond.attr) {
    case 'contact_label':         return p.labels || [];
    case 'contact_email':         return p.email;
    case 'contact_name':          return p.name;
    case 'contact_phone':         return p.phone;
    case 'contact_country':       return p.city;
    case 'conversation_status':   return c.status;
    case 'conversation_priority': return c.priority;
    case 'inbox':                 return c.inbox;
    case 'assigned_agent':        return c.assignee;
    case 'assigned_team':         return c.team;
    case 'message_content':       return c.messages.map(m => m.text || '').join(' ');
    case 'browser_language':      return 'en-US';
    case 'referer':               return 'https://acme.io/pricing';
  }
  return null;
}
function condMatches(cond, c) {
  const vals = cond.values || [];
  const actual = attrValue(cond, c);
  const op = cond.op;
  if (op === 'is_present') return actual != null && String(actual).length > 0;
  if (op === 'is_not_present') return actual == null || String(actual).length === 0;
  const arr = (Array.isArray(actual) ? actual : [actual]).map(a => a == null ? '' : String(a));
  const hit = v => arr.some(a => a.toLowerCase() === String(v).toLowerCase());
  switch (op) {
    case 'equal_to':        return vals.some(hit);
    case 'not_equal_to':    return !vals.some(hit);
    case 'contains':        return vals.some(v => arr.some(a => a.toLowerCase().includes(String(v).toLowerCase())));
    case 'does_not_contain':return !vals.some(v => arr.some(a => a.toLowerCase().includes(String(v).toLowerCase())));
    case 'start_with':      return vals.some(v => arr.some(a => a.toLowerCase().startsWith(String(v).toLowerCase())));
    case 'ends_with':       return vals.some(v => arr.some(a => a.toLowerCase().endsWith(String(v).toLowerCase())));
  }
  return false;
}
const ruleMatches = (r, c) => (r.conditions || []).every(cond => condMatches(cond, c));
const eventLabel = e => (EVENTS.find(x => x[0] === e) || [e, e])[1];

/* 筛选条件行（用于 Folders 构建器） */
function FilterRow(f, i, total) {
  const meta = FILTER_ATTRS[f.attr] || FILTER_ATTRS.status;
  const noVal = f.op === 'is_present' || f.op === 'is_not_present';
  let values;
  if (noVal) values = '<span style="font-size:12.5px;color:var(--faint)">无需值</span>';
  else if (meta.kind === 'list') {
    values = `<span class="chips">` + meta.values().map(v => {
      const on = (f.values || []).includes(v);
      return `<button class="tag ${on ? 'blue' : ''}" data-act="filter-toggle" data-i="${i}" data-v="${esc(v)}">${meta.render ? meta.render(v) : esc(v)}</button>`;
    }).join('') + '</span>';
  } else {
    values = `<input class="field" style="height:34px;max-width:230px" data-sync="filters.${i}.values.0"
      value="${esc((f.values || [])[0] || '')}" placeholder="输入值…">`;
  }
  return `<div class="fb-row">
    <span class="rule-num">${i + 1}</span>
    ${sel(`filters.${i}.attr`, Object.entries(FILTER_ATTRS).map(([k, v]) => [k, v.label]), f.attr)}
    ${sel(`filters.${i}.op`, FILTER_OPS[meta.kind], f.op)}
    <span class="rule-params">${values}</span>
    <button class="ibtn" data-act="filter-del" data-i="${i}" ${total <= 1 ? 'disabled style="opacity:.35"' : ''}>${ic('i-trash','s')}</button>
  </div>`;
}

/* 合并：把 b 合进 a */
const MERGE_FIELDS = [['name','姓名'],['email','邮箱'],['phone','电话'],['company','公司'],['city','地点']];
function doMerge() {
  const M = UI.merge; if (!M || !M.b) return;
  const a = byId(DB.contacts, M.a), b = byId(DB.contacts, M.b);
  if (!a || !b) return;
  const killed = a.convs >= b.convs ? b : a;
  const keep = killed === a ? b : a;
  MERGE_FIELDS.forEach(([k]) => { keep[k] = (M.pick[k] === 'b' ? b : a)[k]; });
  keep.labels = [...new Set([...(a.labels || []), ...(b.labels || [])])];
  keep.convs = (a.convs || 0) + (b.convs || 0);
  keep.ltv = '—';
  DB.conversations.forEach(c => { if (c.contact === killed.id) c.contact = keep.id; });
  const i0 = DB.contacts.findIndex(x => x.id === killed.id);
  if (i0 >= 0) DB.contacts.splice(i0, 1);
  DB.auditLog.unshift({ id: 'g' + (++seq), action: 'contact.merged', actor: DB.me.id,
    target: `${a.name} + ${b.name}`, ip: '203.0.113.24', at: '刚刚', kind: 'contact' });
  UI.merge = null;
  toast(`已合并：${killed.name} → ${keep.name}`);
  go('contacts/' + keep.id);
  render();
}

function endCall(status) {
  const K = UI.call;
  const c = K.convId ? conv(K.convId) : null;
  const dur = fmtDur(K.seconds);
  if (c) {
    pushMsg(c, { t: 'call', direction: K.dir, text: (K.dir === 'inbound' ? 'Inbound' : 'Outbound') + ' call',
                 ts: nowTs(), status, by: status === 'completed' ? DB.me.id : null, duration: dur });
  }
  DB.calls.unshift({ id: 'k' + Math.floor(Math.random() * 9000 + 1000), contact: c ? c.contact : 'c1',
                     dir: K.dir, dur, status, by: status === 'completed' ? DB.me.id : null, ts: 'Just now',
                     recording: K.recording && status === 'completed', transcript: false });

              liveTx: true, txShown: 0, recording: true };
