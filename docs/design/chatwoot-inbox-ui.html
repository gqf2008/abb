function doSend(c, alsoResolve) {
  if (!c) return;
  const i = $('#input'); if (!i) return;
  const text = i.value.trim();
  if (!text && !UI.noteMode) { i.focus(); return; }
  const note = UI.noteMode;
  pushMsg(c, note
    ? { t: 'note', text, ts: nowTs(), by: DB.me.id }
    : { t: 'out', text, ts: nowTs(), status: 'sent', by: DB.me.id });
  if (c.status === 'resolved' && !note) c.status = 'open';
  if (alsoResolve) { c.status = 'resolved'; logActivity(c, 'Conversation was resolved'); }
  UI.drafts[c.id] = '';
  i.value = '';
  if (alsoResolve) toast('Reply sent · conversation resolved'); else toast(note ? 'Private note added' : 'Message sent');
  render();
  if (!note) simulateReply(c);
}

function simulateReply(c) {
  const box = $('#msgs'); if (!box) return;
  const t = document.createElement('div');
  t.className = 'msg left'; t.id = 'typingRow';
  t.innerHTML = `<span class="msg-av">${av(contact(c.contact),'m')}</span>
    <div class="wrap"><div class="bub typing"><i></i><i></i><i></i></div></div>`;
  box.appendChild(t); box.scrollTop = box.scrollHeight;
  setTimeout(() => {
    const cur = conv(c.id); if (!cur) { t.remove(); return; }
    const replies = ['Thanks for the quick reply!', 'That makes sense, thank you 🙏', 'Perfect — appreciate the help.',
      'Got it. When should I expect the update?', 'Understood, thanks for checking.'];
    pushMsg(cur, { t: 'in', text: replies[Math.floor(Math.random() * replies.length)], ts: nowTs() });
    if (route().id === cur.id) render(); else { const m = $('#msgs'); if (m) { m.scrollTop = m.scrollHeight; } t.remove(); }
  }, 1500);
}

document.addEventListener('input', e => {
  const sy = e.target.closest('[data-sync]');
  if (sy) { const root = syncRoot(sy.dataset.sync); if (root) setPath(root, sy.dataset.sync, sy.value); }
  if (e.target.id === 'palQuery') { UI.paletteQuery = e.target.value; UI.paletteSel = 0; renderOverlays();
    const i = $('#palQuery'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }
  if (e.target.id === 'convSearch') { UI.convSearch = e.target.value; render(); }
  if (e.target.id === 'auditQ') { UI.auditQ = e.target.value; render(); }
  if (e.target.id === 'contactSearch') { UI.contactSearch = e.target.value; render(); }
  if (e.target.id === 'input') { e.target.style.height = 'auto'; e.target.style.height = Math.min(e.target.scrollHeight, 220) + 'px'; }
});
document.addEventListener('change', e => {
  const sy = e.target.closest('[data-sync]');
  if (!sy || sy.tagName !== 'SELECT') return;
  const root = syncRoot(sy.dataset.sync);
  if (!root) return;
  setPath(root, sy.dataset.sync, sy.value);
  render();
});
document.addEventListener('keydown', e => {
  const meta = e.metaKey || e.ctrlKey;
  if (meta && e.key.toLowerCase() === 'k') { e.preventDefault(); UI.palette = !UI.palette; UI.paletteQuery = ''; UI.paletteSel = 0; renderOverlays();
    setTimeout(() => { const i = $('#palQuery'); if (i) i.focus(); }, 30); return; }
  if (e.key === 'Escape') { if (UI.palette || UI.modal || UI.menu) { UI.palette = false; UI.modal = null; UI.menu = null; renderOverlays(); } return; }
  if (UI.palette) {
    const items = paletteFiltered();
    if (e.key === 'ArrowDown') { e.preventDefault(); UI.paletteSel = Math.min(UI.paletteSel + 1, items.length - 1); renderOverlays(); focusPal(); }
    if (e.key === 'ArrowUp')   { e.preventDefault(); UI.paletteSel = Math.max(UI.paletteSel - 1, 0); renderOverlays(); focusPal(); }
    if (e.key === 'Enter' && items[UI.paletteSel]) { const h = items[UI.paletteSel].h; UI.palette = false; go(h); }
    return;
  }
  if (UI.modal) return;
  // 会话内：聚焦输入框后可直接回车发送
  if (e.target.id === 'input' && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSend(currentConv(), false); return; }
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'e') { const c = currentConv(); if (c) { if (c.status === 'resolved') { c.status = 'open'; logActivity(c,'Conversation was reopened'); } else { c.status = 'resolved'; logActivity(c,'Conversation was resolved'); } render(); } }
  if (e.key === 'c') { go('conversations'); }
  if (e.key === 'i') { go('inbox'); }
  if (e.key === 'k') { go('contacts'); }
  if (e.key === 'd') { UI.contactPane = !UI.contactPane; render(); }
  if (e.key === 'r') { const i = $('#input'); if (i) { i.focus(); } return; }
  if (e.key === '?') { UI.shortcuts = true; renderOverlays(); }
});
function focusPal() { setTimeout(() => { const i = $('#palQuery'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }, 0); }

window.addEventListener('hashchange', () => { UI.menu = null; render(); });

/* 通话计时 + 实时转写滴入（每 1s，只改 DOM 文字，不整页重渲） */
setInterval(() => {
  const K = UI.call;
  if (K.state !== 'active') return;
  K.seconds++;
  const el = document.getElementById('callTimer');
  if (el) el.textContent = fmtDur(K.seconds);
  if (K.liveTx && K.seconds % 4 === 0 && K.txShown < LIVE_TX_DEMO.length) {
    K.txShown++;
    renderCalls();
  }
}, 1000);

function runSelfTest() {
  const R = [];
  const ok = (n, c) => R.push((c ? 'PASS' : 'FAIL') + '  ' + n);
  try {
    // 1. 路由 + 渲染
    go('conversations/v1'); render();
    ok('route → conversations/v1', route().id === 'v1' && route().name === 'conversations');
    ok('chat header renders contact name', app.innerHTML.includes('Emma Wilson'));
    ok('reply textarea present', !!$('#input'));
    ok('conversation list renders cards', $$('.conv').length >= 8);

    // 2. 发送回复
    const before = conv('v1').messages.length;
    $('#input').value = 'Self-test reply';
    doSend(conv('v1'), false);
    const after = conv('v1').messages;
    ok('send appends a message', after.length === before + 1);
    ok('message is outgoing with text', after.at(-1).t === 'out' && after.at(-1).text === 'Self-test reply');
    ok('draft cleared after send', UI.drafts['v1'] === '');
    // 模拟客户回信是 1.5s 后触发的，这里不等待，排除掉那条

    ok('private note appended', conv('v1').messages.at(-1).t === 'note');
    ok('note did NOT change status', conv('v1').status === 'open');
    UI.noteMode = false; render();

    // 4. 解决 / 重开

    renderCalls();
    const cl = document.getElementById('calllayer');
    ok('incoming call card renders', !!cl && cl.innerHTML.includes('Incoming call') && cl.innerHTML.includes('Emma Wilson'));
    ok('ringing card offers accept + reject', cl.innerHTML.includes('call-accept') && cl.innerHTML.includes('call-reject'));
    UI.call.state = 'active'; UI.call.seconds = 65; renderCalls();
    ok('call turns into in-progress widget', cl.innerHTML.includes('Call in progress') && !!document.getElementById('callTimer'));
    ok('timer shows mm:ss', document.getElementById('callTimer').textContent === '01:05');
    ok('live transcript panel present', cl.innerHTML.includes('cc-tx'));
    const nCalls = DB.calls.length, nMsg = conv('v1').messages.length;
    endCall('completed');
    ok('ending a call resets state', UI.call.state === 'idle' && document.getElementById('calllayer').innerHTML === '');
    ok('call is logged', DB.calls.length === nCalls + 1 && DB.calls[0].status === 'completed');
    ok('call is added to the thread as a message',
       conv('v1').messages.length === nMsg + 1 && conv('v1').messages.at(-1).t === 'call');
    go('calls/k1'); render();
    ok('call detail route works', route().name === 'calls' && route().id === 'k1');
    ok('call detail shows recording + transcript', app.innerHTML.includes('Call recording') && app.innerHTML.includes('local depot'));
    go('calls'); render();
    ok('calls list renders rows', $$('.tbl tbody tr').length === DB.calls.length);

    // 13. 状态流转（snooze / pending / resolved）
    go('conversations/v1'); render();
    const c13 = conv('v1');
    snoozeConv(c13, '4 小时后'); render();
    ok('snooze sets status + until', conv('v1').status === 'snoozed' && conv('v1').snoozeUntil === '4 小时后');
    ok('snoozed shows a banner + unsnooze button', app.innerHTML.includes('取消催办'));
    unsnooze(c13); render();
    ok('unsnooze restores open', conv('v1').status === 'open' && !conv('v1').snoozeUntil);
    c13.status = 'pending'; render();
    ok('pending shows its own banner', app.innerHTML.includes('Pending'));
    c13.status = 'open';
    UI.convFilter = 'snoozed'; go('conversations?f=snoozed'); render();
    ok('snoozed filter works', filteredConvs().every(x => x.status === 'snoozed'));
    UI.convFilter = 'resolved'; go('conversations?f=resolved'); render();
    ok('resolved filter works', filteredConvs().length > 0 && filteredConvs().every(x => x.status === 'resolved'));
    UI.convFilter = 'all'; go('conversations'); render();

    // 14. 批量操作
    ok('bulk mode off by default', UI.bulk.on === false);
    UI.bulk.on = true; UI.bulk.ids = []; render();
    ok('bulk bar renders', !!$('.bulkbar'));
    ok('cards show checkboxes in bulk mode', $$('.cbx').length > 0);
    UI.bulk.ids = ['v2', 'v5']; render();
    ok('bulk selection reflected', $$('.cbx.on').length === 2);
    const applyBulk = () => bulkApply(x => { x.status = 'resolved'; logActivity(x, '批量解决'); }, '已解决');
    applyBulk();
    ok('bulk resolve applied to both', conv('v2').status === 'resolved' && conv('v5').status === 'resolved');
    ok('bulk selection cleared after run', UI.bulk.ids.length === 0);
    conv('v2').status = 'open'; conv('v5').status = 'open';
    UI.bulk = { on: false, ids: [] }; render();

    // 15. 自动化规则
    go('settings/automations'); render();
    ok('automation list renders rules', $$('.set-row').length === DB.automations.length);
    go('settings/automations/a1'); render();
    ok('rule editor opens in draft', UI.rule && UI.rule.id === 'a1');
    ok('editor shows conditions + actions', app.innerHTML.includes('条件') && app.innerHTML.includes('动作'));
    const nCond = UI.rule.conditions.length;
    ok('add condition', (UI.rule.conditions.push(newCondition()), UI.rule.conditions.length === nCond + 1));
    UI.rule.conditions.pop();
    ok('condition toggle adds a value',
      (UI.rule.conditions[0].values = [], setPath(UI.rule, 'conditions.0.values.0', 'VIP'), UI.rule.conditions[0].values[0] === 'VIP'));
    ok('condMatches evaluates labels', condMatches({ attr:'contact_label', op:'equal_to', values:['VIP'] }, conv('v1')) === true);
    ok('condMatches rejects a mismatch', condMatches({ attr:'contact_label', op:'equal_to', values:['Nope'] }, conv('v1')) === false);
    ok('ruleMatches needs all conditions',
      ruleMatches({ conditions:[{attr:'contact_label',op:'equal_to',values:['VIP']},{attr:'conversation_priority',op:'equal_to',values:['urgent']}] }, conv('v1')) === true);
    const nRules = DB.automations.length;
    UI.rule = blankRule(); UI.rule.name = '自测规则'; syncRuleDraft('new'); UI.rule.name = '自测规则';
    UI.rule.conditions[0].values = ['VIP'];
    UI.rule.actions = [newAction('add_label')]; UI.rule.actions[0].p.labels = ['Support'];
    const hits = DB.conversations.filter(x => ruleMatches(UI.rule, x));
    ok('dry run finds matches', hits.length > 0);
    UI.rule.id = 'a' + (++seq); DB.automations.push(UI.rule); UI.rule = null;
    ok('rule saved to store', DB.automations.length === nRules + 1);

    // 16. 宏
    go('settings/macros'); render();
    ok('macro list renders', $$('.set-row').length === DB.macros.length);
    const c16 = conv('v1'); const nLab = c16.labels.length;
    applyMacro(c16, DB.macros[0]);
    ok('applying a macro runs its actions', c16.labels.length >= nLab && c16.messages.at(-1).t === 'out');

    // 17. 快捷回复 / SLA / 分配
    go('settings/canned'); render();
    ok('canned list renders', $$('.set-row').length === DB.canned.length);
    const nCanned = DB.canned.length;
    UI.cannedEdit = 'new'; UI.cannedForm = { code: 'selftest', content: '自测内容' }; render();
    ok('canned editor opens', !!$('[data-sync="cannedForm.code"]'));
    DB.canned.push({ id:'x'+(++seq), code: UI.cannedForm.code, content: UI.cannedForm.content, updated:'刚刚' });
    UI.cannedEdit = null;
    ok('canned saved', DB.canned.length === nCanned + 1);
    go('settings/sla'); render();
    ok('SLA list renders', app.innerHTML.includes('FRT') && $$('.set-row').length === DB.slas.length);
    go('settings/assignment'); render();
    ok('assignment table renders', app.innerHTML.includes('轮流分配') && $$('.tbl tbody tr').length === DB.assignments.length);

    // 18. 通知 / 快捷键
    ok('bell shows unread count', bellUnread() > 0);
    UI.bell = true; renderOverlays();
    ok('notification popover renders', !!$('.notif-pop') && $$('.notif-it').length === DB.notifications.length);
    UI.bell = false; UI.shortcuts = true; renderOverlays();
    ok('shortcuts modal renders', app.innerHTML.includes('快捷键') || document.getElementById('overlays').innerHTML.includes('命令面板'));
    UI.shortcuts = false; renderOverlays();
    DB.notifications.forEach(n => n.read = true);
    ok('mark all read clears the badge', bellUnread() === 0);

    // 19. 保存视图（Folders）+ 筛选构建器
    UI.groupOpen.folders = true;
    go('conversations'); render();
    ok('sidebar lists saved views', app.innerHTML.includes('保存的视图') && DB.folders.every(f => app.innerHTML.includes(f.name)));
    const f1 = byId(DB.folders, 'f1');
    const expect1 = DB.conversations.filter(x => matchesFilters(x, f1.filters, f1.op));
    go('conversations?folder=f1'); render();
    ok('folder filter narrows the list', expect1.length > 0 && filteredConvs().length === expect1.length);
    ok('folder header shows name + conditions', app.innerHTML.includes(f1.name) && app.innerHTML.includes('全部满足'));
    ok('filter semantics (VIP + not resolved)', expect1.every(x => x.labels.includes('VIP') && x.status !== 'resolved'));
    UI.filterDraft = { id: null, name: '', op: 'and', filters: [newFilter()] };
    openModal({ type: 'filters' }); renderOverlays();
    ok('filter builder opens', !!$('[data-sync="name"]') && $$('.fb-row').length === 1);
    UI.filterDraft.filters.push(newFilter()); renderOverlays();
    ok('add condition row', $$('.fb-row').length === 2);
    UI.filterDraft.filters = [{ attr: 'status', op: 'equal_to', values: ['open'] }]; renderOverlays();
    ok('builder previews hit count', document.getElementById('overlays').innerHTML.includes('当前命中'));
    UI.filterDraft.op = 'or'; renderOverlays();
    ok('AND/OR toggle applies', UI.filterDraft.op === 'or');
    const nFolders = DB.folders.length;
    DB.folders.push(JSON.parse(JSON.stringify({ ...UI.filterDraft, id: 'f' + (++seq), name: '自测视图' })));
    UI.filterDraft = null; UI.modal = null; renderOverlays();
    ok('folder saved to store', DB.folders.length === nFolders + 1);
    UI.adhoc = { name: '临时', op: 'and', filters: [{ attr: 'priority', op: 'equal_to', values: ['urgent'] }] };
    go('conversations?adhoc=1'); render();
    ok('ad-hoc filter applies', filteredConvs().length > 0 && filteredConvs().every(x => x.priority === 'urgent'));
    ok('ad-hoc view is tagged unsaved', app.innerHTML.includes('未保存'));
    UI.adhoc = null;

    // 20. 联系人合并
    go('contacts/c10'); render();
    ok('contact detail offers merge', app.innerHTML.includes('合并到'));
    const nContacts = DB.contacts.length;
    const movers = DB.conversations.filter(x => x.contact === 'c10').length;
    UI.merge = { a: 'c10', b: 'c2', pick: { name: 'a', email: 'b', phone: 'a', company: 'a', city: 'a' } };
    doMerge();
    ok('merge removes the secondary contact', DB.contacts.length === nContacts - 1);
    ok('merge keeps the surviving record', !!byId(DB.contacts, 'c10') && !byId(DB.contacts, 'c2'));
    ok('merge moves its conversations', DB.conversations.filter(x => x.contact === 'c10').length === movers + 1);
    ok('merge unions labels', (byId(DB.contacts, 'c10').labels || []).includes('Sales'));
    ok('merge follows the field picks', byId(DB.contacts, 'c10').email === 'daniel.okafor@example.com');
    ok('merge is audited', DB.auditLog[0].action === 'contact.merged');
    ok('merge navigates to the survivor', route().name === 'contacts' && route().id === 'c10');

    // 21. CSAT 报表
    go('reports'); UI.reportTab = 'csat'; render();
    ok('CSAT distribution renders', app.innerHTML.includes('评分分布') && app.innerHTML.includes('按坐席'));
    ok('CSAT responses listed', app.innerHTML.includes('最新反馈'));
    UI.reportTab = 'overview';

    // 22. 审计日志筛器
    go('settings/audit'); render();
    ok('audit renders every entry', $$('.tbl tbody tr').length === DB.auditLog.length);
    UI.auditKind = 'channel'; render();
    ok('audit kind filter works', $$('.tbl tbody tr').length === DB.auditLog.filter(g => g.kind === 'channel').length);
    UI.auditKind = 'all'; UI.auditQ = 'sso'; render();
    ok('audit search works', $$('.tbl tbody tr').length === DB.auditLog.filter(g => (g.action + g.target).toLowerCase().includes('sso')).length);
    UI.auditQ = '';

    // 23. 角色权限矩阵
    go('settings/roles'); render();
    ok('roles list renders', $$('.card.tile').length === DB.roles.length);
    UI.roleDraft = 'r3'; render();
    ok('role matrix renders all resources', $$('.matrix tbody tr').length === PERM_RESOURCES.length);
    UI.roleDraft = 'r1'; render();
    ok('built-in roles are locked', $$('.chk.locked').length === PERM_RESOURCES.length * PERM_ACTIONS.length);
    UI.roleDraft = 'r2'; render();
    const beforePerms = rolePermCount(byId(DB.roles, 'r2'));
    byId(DB.roles, 'r2').perms['report.read'] = !byId(DB.roles, 'r2').perms['report.read'];
    render();
    ok('permission toggles change the count', rolePermCount(byId(DB.roles, 'r2')) === beforePerms + (byId(DB.roles, 'r2').perms['report.read'] ? 1 : -1));
    const nRoles = DB.roles.length;
    const rNew = { id: 'r' + (++seq), name: '自测角色', desc: '', builtin: false, count: 0, perms: {} };
    PERM_RESOURCES.forEach(([res]) => PERM_ACTIONS.forEach(([act]) => { rNew.perms[res + '.' + act] = false; }));
    DB.roles.push(rNew); UI.roleDraft = rNew.id; render();
    ok('new role starts with zero permissions', rolePermCount(byId(DB.roles, rNew.id)) === 0);
    ok('new role added to the list', DB.roles.length === nRoles + 1);

    // 24. 通知偏好
    go('settings/notifications'); render();
    ok('notification prefs render', $$('.tbl tbody tr').length === DB.notificationPrefs.length);
    const pref0 = DB.notificationPrefs[0], wasEmail = pref0.email;
    pref0.email = !pref0.email; render();
    ok('preference toggles', DB.notificationPrefs[0].email === !wasEmail);
    pref0.email = wasEmail;

    // 12. 数据完整性
    ok('every conversation references a real contact', DB.conversations.every(c => !!byId(DB.contacts, c.contact)));
    ok('every conversation references a real inbox', DB.conversations.every(c => !!byId(DB.inboxes, c.inbox)));
    ok('every message has a type + timestamp', DB.conversations.every(c => c.messages.every(m => m.t && m.ts)));
  } catch (e) {
    R.push('FAIL  threw: ' + (e && e.message) + '\n' + (e && e.stack || '').split('\n').slice(0, 3).join('\n'));
  }
  const failed = R.filter(r => r.startsWith('FAIL')).length;
  R.push('');
  R.push(`${R.length - 1} checks · ${failed} failed · ${failed ? 'FAILURES PRESENT' : 'ALL PASS'}`);
  return R;
}

/* 启动 */
if (location.hash.includes('theme=dark')) UI.theme = 'dark';
/* 截图/深链参数：#/widget?wg=open|messages · #/conversations/v1?call=ringing|active */
const wgm = /wg=(\w+)/.exec(location.hash);
if (wgm) { UI.wg.open = true; if (wgm[1] !== 'open') UI.wg.screen = wgm[1]; }
const cm = /call=(\w+)/.exec(location.hash);
if (cm) UI.call = { state: cm[1], convId: 'v1', dir: cm[1] === 'ringing' ? 'inbound' : 'outbound',
  seconds: cm[1] === 'active' ? 74 : 0, muted: false, liveTx: true, txShown: cm[1] === 'active' ? 4 : 0, recording: true };
if (/bulk=1/.test(location.hash)) { UI.bulk = { on: true, ids: ['v2', 'v5'] }; }
if (/bell=1/.test(location.hash)) UI.bell = true;
if (/sc=1/.test(location.hash)) UI.shortcuts = true;
if (/snoozed=1/.test(location.hash)) { const c0 = conv('v1'); if (c0) snoozeConv(c0, '4 小时后'); }
if (/filters=1/.test(location.hash)) UI.filterDraft = { id: null, name: '', op: 'and',
  filters: [{ attr: 'status', op: 'equal_to', values: ['open'] }] };
if (/merge=1/.test(location.hash)) UI.merge = { a: route().id || 'c3', b: null, pick: {} };
const tm = /tab=(\w+)/.exec(location.hash); if (tm) UI.reportTab = tm[1];
const rm = /role=(\w+)/.exec(location.hash); if (rm) UI.roleDraft = rm[1];
if (/unassigned=1/.test(location.hash)) UI.bulk = { on: false, ids: [] };
UI.loggedIn = /^#\/(?!login)/.test(location.hash || '');
document.documentElement.setAttribute('data-theme', UI.theme);
document.documentElement.setAttribute('data-density', UI.density);
if (location.hash.includes('selftest')) {
  UI.loggedIn = true;
  const res = runSelfTest();
  document.body.innerHTML =
    '<pre style="padding:28px;font:13px/1.75 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap">'
    + res.map(l => l.replace(/[&<>]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;' }[c]))).join('\n')
    + '</pre>';
} else {
  render();
  if (UI.filterDraft) openModal({ type: 'filters' });
  if (UI.merge) openModal({ type: 'merge' });
}
</script>
</body>
</html>
