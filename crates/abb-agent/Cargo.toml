# abb-agent —— ABB 的 ACP 执行层（rpi 库驱动），用于替换 crates/buzz-agent。
#
# 设计依据：walgit 线程 `abb-agent-rpi-acp-20261008`。
#
# 为什么是独立包（与 crates/buzz-agent 同构）：root Cargo.toml 没有 [workspace]，
# 所以本包自带 Cargo.lock，root 的 cargo fmt/clippy/test 不会碰到它；CI 走
# `--manifest-path`（同现有 fork-lint 任务的做法）。
#
# 与 buzz-agent 的关键差异（产品决策，见线程「已决」）：
#   - agent **不碰权限**：不实现 OS 沙箱档位，`initialize` 响应**不声明**
#     `_meta.abbSandbox`（如实声明，不伪装能力）；
#   - **不发** `session/request_permission`：授权约定由 AGENTS.md 承担；
#   - LLM 层与 agent loop 不再自持，改为依赖 rpi 库（rpi-ai / rpi-agent）；
#     内置工具由 rpi-tools 提供（见 src/builtin.rs）。删掉原 7.9k 行 llm.rs 与 1.9k 行 agent.rs。
#
# 构建：cargo build --release --manifest-path crates/abb-agent/Cargo.toml
#
[package]
name = "abb-agent"
version = "0.1.0"
edition = "2021"
# rpi 库的 MSRV 是 1.78，跟它对齐。
rust-version = "1.78"
license = "MIT"
repository = "https://github.com/gqf2008/abb"
description = "ABB 的 ACP 执行层：由 rpi 库驱动的独立 agent 进程（替代 buzz-agent）"
readme = "README.md"
keywords = ["acp", "agent", "abb", "rpi"]
categories = ["command-line-utilities"]

[lib]
name = "abb_agent"
path = "src/lib.rs"

[[bin]]
name = "abb-agent"
path = "src/main.rs"

[dependencies]
# rpi 库（library-first）：agent loop / LLM 协议适配 / 内置工具。
# 版本与 crates.io 上的发布保持一致；本地锁文件固定实际解析结果。
rpi-agent = "0.3.16"
# 真实 HTTP provider（anthropic 等）在 rpi-ai 里**默认不编**，gated 在 `providers`
# feature 后面——那是它「测试不可能悄悄依赖网络」的设计。本包需要真 LLM，故显式打开；
# faux provider 不受影响（它不在该 feature 下），所以离线 smoke 仍然不联网。
rpi-ai = { version = "0.3.16", features = ["providers"] }
# 内置工具（read/write/edit/bash/grep/find/ls）+ 执行环境（OsExecutionEnv）。
# 被替代组件把这些写在自持的 devtools.rs 里（4 个工具）；这里用 rpi 的移植版。
rpi-tools = "0.3.16"

tokio = { version = "1", features = [
    "rt-multi-thread", "macros", "time", "sync", "io-util", "io-std", "process"] }
serde = { version = "1", features = ["derive"] }
# 技能 `SKILL.md` 的 YAML frontmatter（与参照物同一个 crate 与版本线）。
serde_yaml = "0.9"
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
# 跨平台 home（与 fork 同源：Windows 只有 USERPROFILE，手写单一 env 读法会丢掉
# `~/AGENTS.md` 全局层与 `~/.agents/skills`）。
dirs = "6"

# MCP 客户端（owner 决策：用 rmcp，与被替代的 buzz-agent 同源）。
# 只开 client + 子进程传输：不需要 server 侧与其它传输。
rmcp = { version = "1", default-features = false, features = [
    "client", "transport-child-process"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "rt-multi-thread", "macros"] }
